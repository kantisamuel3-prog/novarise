<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Novarise</title>

<style>
/* =====================================================
   GLOBAL
===================================================== */
*{ box-sizing:border-box; }
html{ scroll-behavior:smooth; }
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:
    radial-gradient(circle at 8% 0%,rgba(43,156,255,.14),transparent 28%),
    radial-gradient(circle at 96% 18%,rgba(33,200,122,.09),transparent 24%),
    linear-gradient(180deg,#f6fbff 0%,#eef6fc 48%,#f8fbfd 100%);
  color:#163b64;
  padding-bottom:92px;
}

/* =====================================================
   HEADER
===================================================== */
header{
  min-height:82px;
  padding:10px 5%;
  background:linear-gradient(135deg,#061f43 0%,#0a3f78 58%,#0b609e 100%);
  color:white;
  display:flex;
  justify-content:space-between;
  align-items:center;
  box-shadow:0 8px 28px rgba(5,44,82,.20);
  position:relative;
  z-index:10;
}

.logo{ display:flex; align-items:center; gap:11px; min-width:0; }
.logo-image{ width:82px; height:62px; object-fit:contain; display:block; filter:drop-shadow(0 5px 10px rgba(0,0,0,.14)); }
.logo-copy{ display:flex; flex-direction:column; align-items:flex-start; gap:5px; min-width:0; }
.logo-copy strong{ display:block; color:#fff; font-size:13px; line-height:1.2; letter-spacing:.15px; font-weight:800; white-space:nowrap; }
.logo-copy small{ display:block; color:rgba(255,255,255,.76); font-size:9px; line-height:1.2; letter-spacing:.65px; font-weight:600; white-space:nowrap; }

#logoutButton{
  border:0;
  background:rgba(255,255,255,.10);
  color:white;
  padding:10px 16px;
  border-radius:12px;
  cursor:pointer;
  font-weight:bold;
  font-size:14px;
  border:1px solid rgba(255,255,255,.24);
  box-shadow:0 5px 14px rgba(0,0,0,.08);
}
#logoutButton:hover{ background:rgba(255,255,255,.2); }

/* =====================================================
   MAIN
===================================================== */
main{ max-width:1250px; margin:28px auto 34px; padding:0 22px; }
.welcome{ margin-bottom:19px; }
.welcome h2{ margin:0 0 5px; font-size:29px; letter-spacing:-.45px; color:#103b69; }
#userEmail{ color:#7188a1; font-size:13px; word-break:break-word; }

/* =====================================================
   TOP GRID & BALANCE CARD
===================================================== */
.top-grid{
  display:grid;
  grid-template-columns:minmax(0,2fr) minmax(320px,1fr);
  gap:22px;
  margin-bottom:25px;
}

.card{
  background:rgba(255,255,255,.94);
  border-radius:20px;
  padding:28px;
  box-shadow:0 10px 30px rgba(20,78,119,.075);
  border:1px solid rgba(137,181,216,.25);
}

.balance-card{
  isolation:isolate;
  overflow:hidden;
  min-height:278px;
  padding:28px;
  border-radius:24px;
  background:
    radial-gradient(ellipse at 93% 7%,rgba(76,226,255,.38),transparent 25%),
    radial-gradient(ellipse at 68% 88%,rgba(0,174,255,.22),transparent 31%),
    linear-gradient(135deg,#032b62 0%,#064b97 48%,#087dc4 100%);
  color:white;
  box-shadow:0 18px 42px rgba(0,65,125,.26);
  position:relative;
}

.balance-title{ display:flex; align-items:center; gap:11px; position:relative; z-index:2; }
.balance-icon{
  width:40px; height:40px; border-radius:13px;
  background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.13);
  display:flex; align-items:center; justify-content:center; font-size:20px; flex-shrink:0;
}
.balance-title h3{ margin:0; font-size:15px; letter-spacing:.1px; }

.balance{
  font-size:31px;
  font-weight:bold;
  margin:12px 0 14px;
  letter-spacing:-.9px;
  overflow-wrap:anywhere;
  position:relative;
  z-index:2;
}

.buttons{ display:flex; gap:10px; flex-wrap:wrap; position:relative; z-index:3; }
button{ border:0; padding:11px 18px; border-radius:11px; cursor:pointer; font-weight:bold; font-size:14px; transition:.2s ease; }
button:hover{ transform:translateY(-1px); }

#depositButton{ background:linear-gradient(135deg,#00dc78,#16b96d); color:white; box-shadow:0 7px 15px rgba(0,0,0,.10); }
#withdrawButton{ background:transparent; color:white; border:1px solid rgba(255,255,255,.45); }

/* =====================================================
   BOTTOM NAVIGATION
===================================================== */
.bottom-nav{
  position:fixed; left:0; right:0; bottom:0; height:78px;
  background:rgba(255,253,246,.97); border-top:1px solid #e7e2d7;
  box-shadow:0 -5px 20px rgba(15,23,42,.08);
  display:flex; align-items:stretch; justify-content:space-around;
  z-index:99999; backdrop-filter:blur(12px);
}
.nav-item{
  flex:1; max-width:150px; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:4px;
  text-decoration:none; color:#777; font-size:13px; font-weight:500;
}
.nav-item.active{ color:#2563eb; font-weight:600; }
</style>
</head>

<body>

<header>
  <div class="logo">
    <div class="logo-copy">
      <strong>NOVARISE</strong>
      <small>SECURE INVESTMENT PLATFORM</small>
    </div>
  </div>
  <button id="logoutButton">Logout</button>
</header>

<main>
  <div class="welcome">
    <h2>Welcome Back</h2>
    <div id="userEmail">user@novarise.local</div>
  </div>

  <div class="top-grid">
    <div class="card balance-card">
      <div class="balance-title">
        <div class="balance-icon">💰</div>
        <h3>Total Balance</h3>
      </div>
      <div class="balance" id="totalBalance">₱0.00</div>
      <div class="buttons">
        <button id="depositButton">Deposit</button>
        <button id="withdrawButton">Withdraw</button>
      </div>
    </div>
  </div>
</main>

<nav class="bottom-nav">
  <a href="#" class="nav-item active">Home</a>
  <a href="#" class="nav-item">Invest</a>
  <a href="#" class="nav-item">Profile</a>
</nav>

</body>
</html>
