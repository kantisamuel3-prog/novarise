<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXORA - Custom Interface</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;600;700&family=Montserrat:wght@800;900&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                        brand: ['Montserrat', 'sans-serif']
                    },
                    colors: {
                        nexora: {
                            navy: '#0a1628',
                            deep: '#040814',
                            card: '#0d1d35',
                            cyan: '#00f2fe',
                            blue: '#1890ff',
                            gold: '#dfb248',
                            accent: '#00e676'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background: radial-gradient(circle at 50% 40%, #0d1e38 0%, #061124 50%, #020712 100%);
            color: #f1f5f9;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
        }

        .text-chrome-3d {
            background: linear-gradient(180deg, #ffffff 0%, #e2e8f0 35%, #94a3b8 65%, #64748b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0px 4px 10px rgba(0, 0, 0, 0.9));
        }

        .metallic-pill-input {
            background: linear-gradient(180deg, rgba(8, 18, 36, 0.9) 0%, rgba(4, 10, 22, 0.95) 100%);
            border: 1.5px solid rgba(0, 242, 254, 0.25);
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.8), 0 0 10px rgba(0,242,254,0.05);
            border-radius: 9999px;
        }

        .btn-metallic {
            background: linear-gradient(180deg, #1e293b 0%, #0f172a 60%, #090d16 100%);
            border: 2px solid #00f2fe;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.4);
            border-radius: 9999px;
            transition: all 0.25s ease;
        }
        .btn-metallic:hover {
            background: linear-gradient(180deg, #2563eb 0%, #1d4ed8 60%, #0f172a 100%);
            box-shadow: 0 0 35px rgba(0, 242, 254, 0.8);
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center p-4">

    <!-- Card Container -->
    <div class="w-full max-w-md bg-nexora-card/80 border border-nexora-cyan/30 rounded-3xl p-6 backdrop-blur-md shadow-2xl">
        <h1 class="text-chrome-3d text-3xl font-brand font-black text-center mb-4">NEXORA UI</h1>
        
        <!-- Pill Input Sample -->
        <div class="metallic-pill-input flex items-center px-4 py-3 mb-4">
            <i class="fa-solid fa-user text-nexora-cyan mr-3"></i>
            <input type="text" placeholder="USERNAME" class="bg-transparent text-white font-mono focus:outline-none w-full">
        </div>

        <!-- Button Sample -->
        <button class="btn-metallic w-full py-3 text-white font-mono font-bold tracking-widest uppercase">
            SUBMIT
        </button>
    </div>

</body>
</html>
