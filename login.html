      .iti {
        display: block;
        flex: 1 1 0%;
        width: 100%;
        min-width: 0;
      }
      .iti input.iti__tel-input {
        display: block;
        width: 100% !important;
        min-width: 0;
        box-sizing: border-box;
        /* Let intl-tel-input calculate the correct space for each dial code. */
        padding-left: 8px;
      }
      .iti__country-container { left: 0; }
      .iti__selected-country {
        background: transparent !important;
        border-radius: 999px 0 0 999px;
        min-width: 70px;
        max-width: 92px;
        padding: 0 7px !important;
        display: inline-flex !important;
        align-items: center;
        justify-content: center;
        gap: 7px;
        color: #f4fbff !important;
      }
      /* Compact selected country control: show the flag and dialing code. */
      .nexora-selected-flag { display: inline-flex; align-items: center; justify-content: center; font-size: 17px; line-height: 1; flex-shrink: 0; }

    <script>
        const canvas = document.getElementById('chartCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let candles = [];
        const candleWidth = 14;
        const spacing = 22;

        function initCandles() {
            candles = [];
            const count = Math.ceil(canvas.width / spacing) + 5;
            let currentPrice = canvas.height * 0.55;

            for (let i = 0; i < count; i++) {
                const open = currentPrice;
                const close = open + (Math.random() - 0.48) * 35;
                const high = Math.max(open, close) + Math.random() * 15;
                const low = Math.min(open, close) - Math.random() * 15;
                candles.push({ open, close, high, low, x: i * spacing });
                currentPrice = close;
            }
        }

        function drawChart() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < candles.length; i++) {
                const c = candles[i];
                const isBullish = c.close <= c.open;
                ctx.strokeStyle = isBullish ? '#00e676' : '#ff5252';
                ctx.fillStyle = isBullish ? 'rgba(0, 230, 118, 0.5)' : 'rgba(255, 82, 82, 0.5)';

                ctx.beginPath();
                ctx.moveTo(c.x + candleWidth / 2, c.high);
                ctx.lineTo(c.x + candleWidth / 2, c.low);
                ctx.stroke();

                const bodyY = Math.min(c.open, c.close);
                const bodyHeight = Math.max(Math.abs(c.open - c.close), 2);
                ctx.fillRect(c.x, bodyY, candleWidth, bodyHeight);

                c.x -= 0.4;
            }

            if (candles.length > 0 && candles[0].x < -spacing) {
                const last = candles[candles.length - 1];
                const open = last.close;
                const close = open + (Math.random() - 0.48) * 35;
                const high = Math.max(open, close) + Math.random() * 15;
                const low = Math.min(open, close) - Math.random() * 15;
                candles.shift();
                candles.push({ open, close, high, low, x: last.x + spacing });
            }

            requestAnimationFrame(drawChart);
        }

        initCandles();
        drawChart();
    </script>

            overlay.className = 'nexora-country-overlay';
            overlay.id = 'nexoraCountryOverlay';
            overlay.innerHTML = `
              <section class="nexora-country-modal" role="dialog" aria-modal="true" aria-labelledby="nexoraCountryTitle">
                <div class="nexora-country-head">
                  <div class="nexora-country-title">
                    <h2 id="nexoraCountryTitle"><i class="fa-solid fa-globe" style="color:#00f2fe;margin-right:8px"></i>SELECT COUNTRY</h2>
                    <button type="button" class="nexora-country-close" id="nexoraCountryClose" aria-label="Close country selector"><i class="fa-solid fa-xmark"></i></button>
                  </div>
                  <p class="nexora-country-subtitle">Search a country or international dialing code</p>
                  <label class="nexora-country-search-wrap" for="nexoraCountrySearch">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input id="nexoraCountrySearch" type="search" placeholder="Search country or code (e.g. +63)" autocomplete="off">
                  </label>
                </div>
                <div class="nexora-country-list" id="nexoraCountryList" role="listbox" aria-label="Countries"></div>
              </section>`;
            document.body.appendChild(overlay);
            const search = overlay.querySelector('#nexoraCountrySearch');
            const list = overlay.querySelector('#nexoraCountryList');
            const closeButton = overlay.querySelector('#nexoraCountryClose');
            const priorityCountries = ['us', 'au', 'cn', 'sg', 'vn', 'ph'];
            const countries = (window.intlTelInput.getCountryData ? window.intlTelInput.getCountryData() : [])
                .slice().sort((a, b) => {
                    const ai = priorityCountries.indexOf(a.iso2);
                    const bi = priorityCountries.indexOf(b.iso2);
                    if (ai !== -1 || bi !== -1) {
                        if (ai === -1) return 1;
                        if (bi === -1) return -1;
                        return ai - bi;
                    }
                    return a.name.localeCompare(b.name);
                });

            // Show the selected country's flag beside its dialing code in the phone field.
            // The custom centered search modal remains available when the control is clicked.
            function updateCompactCountryControl() {
                const button = phoneInput.closest('.iti')?.querySelector('.iti__selected-country');
                if (!button) return;
                const country = iti.getSelectedCountryData();
                button.innerHTML = `<span class="nexora-selected-flag" aria-hidden="true">${flagEmoji(country.iso2)}</span><span class="nexora-selected-dial-code">+${country.dialCode || '1'}</span>`;
                button.setAttribute('aria-label', `Selected country ${country.name}, dialing code +${country.dialCode}. Click to choose another country`);
                button.setAttribute('title', `${country.name} +${country.dialCode} — choose country`);
            }

            function flagEmoji(iso2) {
                if (!iso2 || iso2.length !== 2) return '🌐';
                return String.fromCodePoint(...iso2.toUpperCase().split('').map(ch => 127397 + ch.charCodeAt(0)));
            }
            function renderCountries() {
                const term = search.value.trim().toLowerCase().replace(/^\+/, '');
                const filtered = countries.filter(country =>
                    country.name.toLowerCase().includes(term) ||
                    country.dialCode.includes(term) ||
                    ('+' + country.dialCode).includes(search.value.trim()) ||
                    country.iso2.toLowerCase() === term
                );
                list.replaceChildren();
                if (!filtered.length) {
                    const empty = document.createElement('div');
                    empty.className = 'nexora-country-empty';
                    empty.textContent = 'No country found. Try another name or dialing code.';
                    list.appendChild(empty);
                    return;
                }
                // With an empty search, show the requested popular countries first,
                // followed by every other country alphabetically. Search results stay ungrouped.
                const showSections = search.value.trim() === '';
                const prioritySet = new Set(priorityCountries);
                if (showSections) {
                    const popularHeading = document.createElement('div');
                    popularHeading.className = 'nexora-country-section';
                    popularHeading.textContent = 'Popular countries';
                    list.appendChild(popularHeading);
                }
                let allHeadingAdded = false;
                filtered.forEach(country => {
                    if (showSections && !prioritySet.has(country.iso2) && !allHeadingAdded) {
                        const allHeading = document.createElement('div');
                        allHeading.className = 'nexora-country-section';
                        allHeading.textContent = 'All countries';
                        list.appendChild(allHeading);
                        allHeadingAdded = true;
                    }
                    const option = document.createElement('button');
                    option.type = 'button';
                    option.className = 'nexora-country-option' + (country.iso2 === iti.getSelectedCountryData().iso2 ? ' is-selected' : '');
                    option.setAttribute('role', 'option');
                    option.setAttribute('aria-selected', country.iso2 === iti.getSelectedCountryData().iso2 ? 'true' : 'false');
                    option.innerHTML = `<span class="nexora-country-flag" aria-hidden="true">${flagEmoji(country.iso2)}</span><span class="nexora-country-name"></span><span class="nexora-country-code">+${country.dialCode}</span>`;
                    option.querySelector('.nexora-country-name').textContent = country.name;
                    option.addEventListener('click', () => {
                        iti.setCountry(country.iso2);
                        updateCompactCountryControl();
                        overlay.classList.remove('is-open');
                        search.value = '';
                        renderCountries();
                        phoneInput.focus();
                    });
                    list.appendChild(option);
                });
            }
            function openCountryPicker(event) {
                if (event) { event.preventDefault(); event.stopPropagation(); }
                updateCompactCountryControl();
                overlay.classList.add('is-open');
                search.value = '';
                renderCountries();
                setTimeout(() => search.focus(), 30);
            }
            if (countryButton) {
                countryButton.addEventListener('click', openCountryPicker, true);
                countryButton.setAttribute('aria-label', 'Choose country and dialing code');
                countryButton.setAttribute('title', 'Choose country and dialing code');
            }
            search.addEventListener('input', renderCountries);
            closeButton.addEventListener('click', () => overlay.classList.remove('is-open'));
            overlay.addEventListener('click', event => {
                if (event.target === overlay) overlay.classList.remove('is-open');
            });
            document.addEventListener('keydown', event => {
                if (event.key === 'Escape' && overlay.classList.contains('is-open')) {
                    overlay.classList.remove('is-open');
                }
            });
            phoneInput.addEventListener('countrychange', updateCompactCountryControl);
            updateCompactCountryControl();
            renderCountries();
        }

        function getPhoneDetails() {
            const national = phoneInput ? phoneInput.value.replace(/\D/g, '') : '';
            const selected = iti ? iti.getSelectedCountryData() : { dialCode: '1', iso2: 'us' };
            const dialCode = selected && selected.dialCode ? selected.dialCode : '1';
            return { national, dialCode, full: dialCode + national, country: selected && selected.iso2 ? selected.iso2 : 'us' };
        }

        function showMessage(msg, isError = true) {
            if (!messageDiv) return;
            messageDiv.textContent = msg;
            messageDiv.classList.remove('hidden', 'bg-red-500/20', 'text-red-300', 'border-red-500/40', 'bg-emerald-500/20', 'text-emerald-300', 'border-emerald-500/40');
            
            if (isError) {
                messageDiv.classList.add('bg-red-500/20', 'text-red-300', 'border-red-500/40');
            } else {
                messageDiv.classList.add('bg-emerald-500/20', 'text-emerald-300', 'border-emerald-500/40');
            }
        }

        // Biometric Unlock Logic - Naayos na para mag-click nang maayos
        if (biometricBtn) {
            biometricBtn.addEventListener('click', function(e) {
                e.preventDefault();
                const phoneVal = phoneInput ? phoneInput.value.trim() : '';
                const passVal = passwordInput ? passwordInput.value : '';

                if (!phoneVal || phoneVal.length < 4 || !passVal) {
                    showMessage('Please enter your phone number and password first before scanning fingerprint.', true);
                    return;
                }

                showMessage("Scanning Touch ID / Biometric...", false);
                setTimeout(() => {
                    isBiometricVerified = true;
                    showMessage("Biometric Identity Verified. Enter button unlocked.", false);
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = '<span>ENTER</span>';
                }, 1000);
            });
        }

        if (loginForm) {
            loginForm.addEventListener('submit', async function(e) {
                e.preventDefault();

                if (!isBiometricVerified) {
                    showMessage('Please verify using Touch ID / Biometric first.', true);
                    return;
                }
                
                const phoneDetails = getPhoneDetails();
                const phoneVal = phoneDetails.national;
                const internationalPhone = phoneDetails.full;
                const passVal = passwordInput ? passwordInput.value : '';

                if (!phoneVal || phoneVal.length < 4 || !passVal) {
                    showMessage('Please enter phone number and password.', true);
                    return;
                }

                loginBtn.disabled = true;
                loginBtn.innerHTML = '<span>AUTHENTICATING...</span>';

                try {
                    const usersRef = db.collection("Users");
                    let querySnapshot = await usersRef.where("phone", "==", phoneVal).get();

                    if (querySnapshot.empty) {
                        querySnapshot = await usersRef.where("phone", "==", internationalPhone).get();
                    }
                    if (querySnapshot.empty) {
                        querySnapshot = await usersRef.where("phone", "==", "+" + internationalPhone).get();
                    }
                    if (querySnapshot.empty && phoneDetails.dialCode === "63") {
                        querySnapshot = await usersRef.where("phone", "==", "0" + phoneVal).get();
                    }
                    if (querySnapshot.empty) {
                        querySnapshot = await usersRef.where("normalizedPhone", "==", internationalPhone).get();
                    }
                    if (querySnapshot.empty && phoneDetails.dialCode === "63") {
                        querySnapshot = await usersRef.where("normalizedPhone", "==", "63" + phoneVal).get();
                    }
                    if (querySnapshot.empty) {
                        querySnapshot = await usersRef.where("phoneNumber", "==", internationalPhone).get();
                    }
                    if (querySnapshot.empty) {
                        querySnapshot = await usersRef.where("phoneNumber", "==", phoneVal).get();
                    }

                    if (querySnapshot.empty) {
                        showMessage("Incorrect phone number or password.", true);
                        loginBtn.disabled = false;
                        loginBtn.innerHTML = '<span>ENTER</span>';
                        return;
                    }

                    const userDoc = querySnapshot.docs[0];
                    const userData = userDoc.data();
                    const storedPassword = userData.password;

                    if (storedPassword === passVal) {
                        const phoneDigits = phoneVal.replace(/\D/g, "");
                        const normalizedPhone = phoneDigits.replace(/^0+/, "");
                        const syntheticEmail = phoneDetails.dialCode + normalizedPhone + "@nexora.local";

                        try {
                            await auth.signInWithEmailAndPassword(
                                syntheticEmail,
                                passVal
                            );

                            localStorage.setItem("nexora_user_uid", userDoc.id);
                            showMessage("Login successful. Redirecting...", false);

                            setTimeout(() => {
                                if (
                                    (phoneDetails.dialCode === "63" && phoneVal === "9999999999") ||
                                    userData.email === "639999999999@nexora.local"
                                ) {
                                    window.location.href = "admin-withdraw.html";
                                } else {
                                    window.location.href = "dashboard.html";
                                }
                            }, 700);

                        } catch (authErr) {
                            console.warn("Sign-in failed, checking account state...", authErr);

                            try {
                                if (authErr.code === "auth/email-already-in-use") {
                                    // Kung may nag-e-exist na account pero mali ang password, 
                                    // pwede nating i-sign in ang user gamit ang admin o i-update ang password, 
                                    // o kaya ay sabihin sa system na i-reset ang password sa Auth.
                                    // Subukan nating i-update kung naka-login o i-re-register sa pamamagitan ng password reset.
                                    showMessage("Account exists with different auth credentials. Please check your password.", true);
                                } else {
                                    await auth.createUserWithEmailAndPassword(syntheticEmail, passVal);
                                }

                                localStorage.setItem("nexora_user_uid", userDoc.id);
                                showMessage("Account synchronized successfully. Redirecting...", false);

                                setTimeout(() => {
                                    if (
                                        (phoneDetails.dialCode === "63" && phoneVal === "9999999999") ||
                                        userData.email === "639999999999@nexora.local"
                                    ) {
                                        window.location.href = "admin-withdraw.html";
                                    } else {
                                        window.location.href = "dashboard.html";
                                    }
                                }, 700);

                            } catch (recoveryErr) {
                                console.error("Firebase Authentication recovery error:", recoveryErr);
                                showMessage(
                                    "Firebase login failed. Please check your credentials or register again.",
                                    true
                                );

                                loginBtn.disabled = false;
                                loginBtn.innerHTML = "<span>ENTER</span>";
                            }
                        }
                    } else {
                        showMessage("Incorrect phone number or password.", true);
                        loginBtn.disabled = false;
                        loginBtn.innerHTML = "<span>ENTER</span>";
                    }

                } catch (error) {
                    console.error("Login Error:", error);
                    showMessage("An error occurred during login. Please try again.", true);
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = '<span>ENTER</span>';
                }
            });
        }
    });
    </script>
</body>
