<!DOCTYPE html>
<html lang="en" class="h-full select-none">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXORA - Financial Trading Terminal</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">

    <!-- Firebase SDKs (Compat v10) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                        brand: ['Montserrat', 'sans-serif']
                    },
                    colors: {
                        nexora: {
                            navy: '#0a1628',
                            deep: '#040814',
                            card: '#0d1d35',
                            cyan: '#00f2fe',
                            blue: '#1890ff',
                            gold: '#dfb248',
                            goldGlow: '#ffd700',
                            accent: '#00e676'
                        }
                    },
                    animation: {
                        'marquee': 'marquee 25s linear infinite',
                        'pulse-cyan': 'pulseCyan 3s ease-in-out infinite',
                        'orbit': 'orbit 10s linear infinite',
                        'glow-pulse': 'glowPulse 2s ease-in-out infinite'
                    },
                    keyframes: {
                        marquee: {
                            '0%': { transform: 'translateX(0%)' },
                            '100%': { transform: 'translateX(-50%)' }
                        },
                        pulseCyan: {
                            '0%, 100%': { filter: 'drop-shadow(0 0 15px rgba(0,242,254,0.4))' },
                            '50%': { filter: 'drop-shadow(0 0 35px rgba(0,242,254,0.9)) drop-shadow(0 0 60px rgba(0,242,254,0.4))' }
                        },
                        orbit: {
                            '0%': { transform: 'rotate(0deg)' },
                            '100%': { transform: 'rotate(360deg)' }
                        },
                        glowPulse: {
                            '0%, 100%': { boxShadow: '0 0 15px rgba(0,242,254,0.3), inset 0 0 10px rgba(0,242,254,0.2)' },
                            '50%': { boxShadow: '0 0 30px rgba(0,242,254,0.7), inset 0 0 18px rgba(0,242,254,0.4)' }
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background: radial-gradient(circle at 50% 40%, #0d1e38 0%, #061124 50%, #020712 100%);
            color: #f1f5f9;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
        }

        .brushed-metal-overlay {
            background: repeating-radial-gradient(
                circle at 50% 40%,
                rgba(255, 255, 255, 0.015) 0px,
                rgba(255, 255, 255, 0.015) 1px,
                transparent 1px,
                transparent 3px
            );
        }

        .text-chrome-3d {
            background: linear-gradient(180deg, #ffffff 0%, #e2e8f0 35%, #94a3b8 65%, #64748b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0px 4px 10px rgba(0, 0, 0, 0.9));
        }

        .gold-ring-accent {
            background: radial-gradient(circle, #ffe380 0%, #d4af37 60%, #996515 100%);
            box-shadow: 0 0 12px rgba(212, 175, 55, 0.8), inset 0 0 4px rgba(255, 255, 255, 0.8);
        }

        .metallic-pill-input {
            background: linear-gradient(180deg, rgba(8, 18, 36, 0.9) 0%, rgba(4, 10, 22, 0.95) 100%);
            border: 1.5px solid rgba(0, 242, 254, 0.25);
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.8), 0 0 10px rgba(0,242,254,0.05);
            border-radius: 9999px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .metallic-pill-input:focus-within {
            border-color: #00f2fe;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.9), 0 0 20px rgba(0,242,254,0.5);
        }

        .btn-metallic-enter {
            background: linear-gradient(180deg, #1e293b 0%, #0f172a 60%, #090d16 100%);
            border: 2px solid #00f2fe;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.4), inset 0 1px 2px rgba(255, 255, 255, 0.4);
            border-radius: 9999px;
            transition: all 0.25s ease;
        }
        .btn-metallic-enter:hover:not(:disabled) {
            background: linear-gradient(180deg, #2563eb 0%, #1d4ed8 60%, #0f172a 100%);
            border-color: #38bdf8;
            box-shadow: 0 0 35px rgba(0, 242, 254, 0.8), inset 0 1px 4px rgba(255, 255, 255, 0.8);
            transform: scale(1.02);
        }
        .btn-metallic-enter:disabled {
            background: rgba(15, 23, 42, 0.5);
            border-color: rgba(100, 116, 139, 0.3);
            color: #64748b;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        .fingerprint-btn {
            background: radial-gradient(circle, rgba(0, 242, 254, 0.15) 0%, rgba(8, 20, 42, 0.8) 70%);
            border: 1px solid rgba(0, 242, 254, 0.4);
            transition: all 0.3s ease;
        }
        .fingerprint-btn:hover {
            border-color: #00f2fe;
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.6);
            transform: scale(1.08);
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #020712; }
        ::-webkit-scrollbar-thumb { background: #00f2fe; border-radius: 2px; }
    </style>
</head>
<body class="flex flex-col justify-between relative overflow-x-hidden selection:bg-nexora-cyan selection:text-black">

                <div class="inline-flex animate-marquee space-x-10 items-center pl-6">
                    <div class="flex items-center space-x-2">

                    </div>
                    <div class="flex items-center space-x-2">

                    </div>

    <main class="relative z-10 my-auto py-8 px-4 flex flex-col items-center justify-center w-full max-w-xl mx-auto text-center">
        
        <div class="relative w-36 h-36 mb-2 flex items-center justify-center animate-pulse-cyan">
            <div class="absolute inset-0 rounded-full border-2 border-dashed border-nexora-cyan/50 animate-orbit"></div>
            <svg class="w-28 h-28 drop-shadow-[0_0_20px_rgba(0,242,254,0.9)]" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <polygon points="18,15 36,10 36,90 18,85" fill="#0284c7" stroke="#00f2fe" stroke-width="0.8" />
                <polygon points="36,10 82,75 82,90 64,90 18,25 18,15" fill="#00f2fe" stroke="#00f2fe" stroke-width="0.8" />
                <polygon points="64,10 82,15 82,85 64,90" fill="#0369a1" stroke="#00f2fe" stroke-width="0.8" />
            </svg>
        </div>

        <div class="flex items-center justify-center space-x-1 tracking-wider text-4xl sm:text-5xl font-black font-brand mt-1 mb-1">
            <span class="text-chrome-3d">NEX</span>
            <span class="relative inline-flex items-center justify-center w-8 h-8 sm:w-10 sm:h-10 mx-1 border-2 border-nexora-gold rounded-full gold-ring-accent">
                <span class="w-3 h-3 rounded-full bg-slate-900 border border-nexora-gold"></span>
            </span>
            <span class="text-chrome-3d">RA</span>
        </div>

        <p class="text-xs sm:text-sm font-bold tracking-[0.3em] text-nexora-gold flex items-center justify-center uppercase font-mono mb-8">

        <form id="loginForm" class="w-full max-w-sm space-y-4">
            
            <div class="relative">
                <div class="metallic-pill-input flex items-center px-4 py-3">
                    <div class="text-gray-300 pr-3 border-r border-nexora-cyan/30 flex items-center text-lg">

                    <div class="flex items-center w-full pl-3 font-mono text-sm">

                        >

                </div>
            </div>

            <div class="relative">
                <div class="metallic-pill-input flex items-center px-4 py-3">
                    <div class="text-gray-300 pr-3 border-r border-nexora-cyan/30 flex items-center text-lg">
                        <i class="fa-solid fa-lock text-nexora-cyan"></i>
                    </div>
                    <div class="flex items-center w-full pl-3 font-mono text-sm relative">
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            placeholder="PASSWORD"

                        <button type="button" id="togglePassword" class="absolute right-0 text-gray-400 hover:text-nexora-cyan focus:outline-none p-1">
                            <i class="fa-solid fa-eye text-sm" id="eyeIcon"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Biometric Fingerprint Button -->
            <div class="pt-2 flex flex-col items-center">
                <button 
                    type="button" 
                    id="biometricBtn"
                    class="fingerprint-btn w-14 h-14 rounded-full flex items-center justify-center text-nexora-cyan focus:outline-none cursor-pointer"
                    title="Sign in with Biometric Fingerprint"
                >
                    <i class="fa-solid fa-fingerprint text-2xl drop-shadow-[0_0_8px_rgba(0,242,254,0.8)]"></i>
                </button>
                <span class="text-[10px] text-nexora-cyan/70 font-mono mt-1 tracking-wider uppercase">TOUCH ID / BIOMETRIC</span>
            </div>

            <div class="flex items-center justify-between text-xs text-gray-400 font-mono px-2 relative z-20">
                <label class="flex items-center space-x-2 cursor-pointer">
                    <input type="checkbox" id="rememberMe" class="accent-nexora-cyan rounded">
                    <span>Remember Me</span>
                </label>
                <a href="forgotpassword.html" class="hover:text-nexora-cyan transition-colors text-nexora-cyan cursor-pointer relative z-30">Forgot Password?</a>
            </div>

            <div id="message" class="hidden p-3 rounded-2xl text-xs font-mono border transition-all"></div>

            <!-- Submit Button (Naka-lock / disabled sa simula) -->
            <div class="pt-2">
                <button 
                    type="submit" 
                    id="loginBtn" 
                    class="btn-metallic-enter w-full py-3.5 text-base font-black font-mono tracking-widest uppercase cursor-pointer flex items-center justify-center space-x-2"

                </button>

        </form>

        <p class="text-xs text-gray-400 font-sans mt-6">
            Don't have an investment account? 
            <a href="register.html" class="text-nexora-gold hover:text-nexora-goldGlow font-semibold underline font-mono ml-1">Register Now</a>
        </p>
    </main>

    <script>
        const canvas = document.getElementById('chartCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let candles = [];
        const candleWidth = 14;
        const spacing = 22;

        function initCandles() {
            candles = [];
            const count = Math.ceil(canvas.width / spacing) + 5;
            let currentPrice = canvas.height * 0.55;

            for (let i = 0; i < count; i++) {
                const open = currentPrice;
                const close = open + (Math.random() - 0.48) * 35;
                const high = Math.max(open, close) + Math.random() * 15;
                const low = Math.min(open, close) - Math.random() * 15;
                candles.push({ open, close, high, low, x: i * spacing });
                currentPrice = close;
            }
        }

        function drawChart() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < candles.length; i++) {
                const c = candles[i];
                const isBullish = c.close <= c.open;
                ctx.strokeStyle = isBullish ? '#00e676' : '#ff5252';
                ctx.fillStyle = isBullish ? 'rgba(0, 230, 118, 0.5)' : 'rgba(255, 82, 82, 0.5)';

                ctx.beginPath();
                ctx.moveTo(c.x + candleWidth / 2, c.high);
                ctx.lineTo(c.x + candleWidth / 2, c.low);
                ctx.stroke();

                const bodyY = Math.min(c.open, c.close);
                const bodyHeight = Math.max(Math.abs(c.open - c.close), 2);
                ctx.fillRect(c.x, bodyY, candleWidth, bodyHeight);

                c.x -= 0.4;
            }

            if (candles.length > 0 && candles[0].x < -spacing) {
                const last = candles[candles.length - 1];
                const open = last.close;
                const close = open + (Math.random() - 0.48) * 35;
                const high = Math.max(open, close) + Math.random() * 15;
                const low = Math.min(open, close) - Math.random() * 15;
                candles.shift();
                candles.push({ open, close, high, low, x: last.x + spacing });
            }

            requestAnimationFrame(drawChart);
        }

        initCandles();
        drawChart();
    </script>

    <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCIBDQOIiCOgfV4pMCUr0oUCNZoIDYDqGk",
      authDomain: "investpro-2dafb.firebaseapp.com",
      projectId: "investpro-2dafb",
      storageBucket: "investpro-2dafb.firebasestorage.app",
      messagingSenderId: "135092039764",
      appId: "1:135092039764:web:c4c71eef0c904346a77dc1",
      measurementId: "G-0L77SFTC4F"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore(); // Naayos na ang db reference para direktang gumana sa Firestore

    let isBiometricVerified = false;

    document.addEventListener('DOMContentLoaded', function() {
        const togglePasswordBtn = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        const eyeIcon = document.getElementById('eyeIcon');
        const phoneInput = document.getElementById('phone');
        const messageDiv = document.getElementById('message');
        const biometricBtn = document.getElementById('biometricBtn');
        const loginBtn = document.getElementById('loginBtn');
        const loginForm = document.getElementById('loginForm');

        if (togglePasswordBtn && passwordInput) {
            togglePasswordBtn.addEventListener('click', function() {
                const isPassword = passwordInput.getAttribute('type') === 'password';
                passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
                if (eyeIcon) {
                    eyeIcon.className = isPassword ? 'fa-solid fa-eye-slash text-sm' : 'fa-solid fa-eye text-sm';
                }
            });
        }

        if (phoneInput) {
            phoneInput.addEventListener('input', function() {
                this.value = this.value.replace(/\D/g, '');
                if (this.value.length > 10) {
                    this.value = this.value.slice(0, 10);
                }
            });
        }

        function showMessage(msg, isError = true) {
            if (!messageDiv) return;
            messageDiv.textContent = msg;
            messageDiv.classList.remove('hidden', 'bg-red-500/20', 'text-red-300', 'border-red-500/40', 'bg-emerald-500/20', 'text-emerald-300', 'border-emerald-500/40');
            
            if (isError) {
                messageDiv.classList.add('bg-red-500/20', 'text-red-300', 'border-red-500/40');
            } else {
                messageDiv.classList.add('bg-emerald-500/20', 'text-emerald-300', 'border-emerald-500/40');
            }
        }

        // Biometric Unlock Logic
        if (biometricBtn) {
            biometricBtn.addEventListener('click', function() {
                const phoneVal = phoneInput ? phoneInput.value.trim() : '';
                const passVal = passwordInput ? passwordInput.value : '';

                if (!/^9\d{9}$/.test(phoneVal) || !passVal) {
                    showMessage('Please enter your phone number and password first before scanning fingerprint.', true);
                    return;
                }

                showMessage("Scanning Touch ID / Biometric...", false);
                setTimeout(() => {
                    isBiometricVerified = true;
                    showMessage("Biometric Identity Verified. Enter button unlocked.", false);
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = '<span>ENTER</span>';
                }, 1000);
            });
        }

        if (loginForm) {
            loginForm.addEventListener('submit', async function(e) {
                e.preventDefault();

                if (!isBiometricVerified) {
                    showMessage('Please verify using Touch ID / Biometric first.', true);
                    return;
                }
                
                const phoneVal = phoneInput ? phoneInput.value.trim() : '';
                const passVal = passwordInput ? passwordInput.value : '';

                if (!phoneVal || !passVal) {
                    showMessage('Please enter phone number and password.', true);
                    return;
                }

                loginBtn.disabled = true;
                loginBtn.innerHTML = '<span>AUTHENTICATING...</span>';

                try {
                    const usersRef = db.collection("Users");
                    let querySnapshot = await usersRef.where("phone", "==", phoneVal).get();
                    
                    if (querySnapshot.empty) {
                        querySnapshot = await usersRef.where("phoneNumber", "==", phoneVal).get();
                    }
                    if (querySnapshot.empty) {
                        querySnapshot = await usersRef.where("mobile", "==", phoneVal).get();
                    }
                    if (querySnapshot.empty) {
                        querySnapshot = await usersRef.where("phone", "==", "0" + phoneVal).get();
                    }

                    if (querySnapshot.empty) {
                        showMessage("Incorrect phone number or password.", true);
                        loginBtn.disabled = false;
                        loginBtn.innerHTML = '<span>ENTER</span>';
                        return;
                    }

                    const userDoc = querySnapshot.docs[0];
                    const userData = userDoc.data();
                    const storedPassword = userData.password;

                    // Ibinuboses nito nang tama ang bagong password mula sa database
                    if (storedPassword === passVal) {
                        showMessage('Login Verified. Redirecting...', false);
                        localStorage.setItem("nexora_user_uid", userDoc.id);

                        setTimeout(() => {
                            if (phoneVal === "9999999999" || userData.email === "639999999999@nexora.local") {
                                window.location.href = "admin-withdraw.html";
                            } else {
                                window.location.href = "dashboard.html";
                            }
                        }, 1000);
                    } else {
                        showMessage("Incorrect phone number or password.", true);
                        loginBtn.disabled = false;
                        loginBtn.innerHTML = '<span>ENTER</span>';
                    }

                } catch (error) {
                    console.error("Login Error:", error);
                    showMessage("An error occurred during login. Please try again.", true);
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = '<span>ENTER</span>';
                }
            });
        }
    });
    </script>
</body>
