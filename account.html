<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Nexora — Account</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  background:#f5f7fb;
  color:#172033;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  min-height:100vh;
  padding-bottom:90px;
}

/* HEADER */
.header{
  background:linear-gradient(135deg,#0b2852,#075fae);
  color:white;
  padding:22px 18px 28px;
  border-radius:0 0 26px 26px;
}

.header-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
}

.logo-icon{
  width:42px;
  height:42px;
  border-radius:13px;
  background:linear-gradient(135deg,#21c87a,#2b9cff);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:23px;
  box-shadow:0 8px 20px rgba(0,0,0,.18);
}

.brand-text{
  font-size:21px;
  font-weight:800;
  letter-spacing:.3px;
}

.brand-sub{
  font-size:10px;
  opacity:.8;
  letter-spacing:2px;
  margin-top:2px;
}

.logout-btn{
  border:1px solid rgba(255,255,255,.25);
  background:rgba(255,255,255,.12);
  color:white;
  border-radius:11px;
  padding:9px 13px;
  font-size:12px;
  font-weight:700;
  cursor:pointer;
}

/* PROFILE */
.profile{
  margin-top:24px;
  display:flex;
  align-items:center;
  gap:13px;
}

.avatar{
  width:58px;
  height:58px;
  border-radius:50%;
  background:rgba(255,255,255,.18);
  border:2px solid rgba(255,255,255,.35);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:27px;
}

.profile-name{
  font-size:18px;
  font-weight:800;
}

.profile-phone{
  font-size:12px;
  opacity:.8;
  margin-top:4px;
}

/* CONTENT */
.container{
  width:100%;
  max-width:650px;
  margin:0 auto;
  padding:20px 15px;
}

.section-title{
  font-size:16px;
  font-weight:800;
  margin:3px 2px 12px;
}

/* BALANCE CARDS */
.balance-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.balance-card{
  background:white;
  border-radius:18px;
  padding:18px 15px;
  box-shadow:0 5px 18px rgba(16,37,63,.07);
  border:1px solid #edf0f5;
  min-height:125px;
}

.balance-label{
  color:#7b8495;
  font-size:11px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.5px;
}

.balance-value{
  margin-top:12px;
  font-size:23px;
  font-weight:800;
  color:#123b68;
  word-break:break-word;
}

.balance-card.usd .balance-value{
  color:#0b72c9;
}

.balance-card.php .balance-value{
  color:#168451;
}

.balance-small{
  margin-top:8px;
  font-size:10px;
  color:#9aa2b1;
}

/* ACCOUNT OPTIONS */
.card{
  margin-top:15px;
  background:white;
  border:1px solid #edf0f5;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 5px 18px rgba(16,37,63,.06);
}

.option{
  width:100%;
  min-height:58px;
  display:flex;
  align-items:center;
  gap:13px;
  padding:13px 15px;
  background:white;
  border:0;
  border-bottom:1px solid #eef1f5;
  text-align:left;
  cursor:pointer;
  color:#172033;
}

.option:last-child{
  border-bottom:0;
}

.option-icon{
  width:38px;
  height:38px;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#eef6ff;
  color:#1672c8;
  font-size:17px;
  flex-shrink:0;
}

.option-title{
  font-size:13px;
  font-weight:800;
}

.option-sub{
  font-size:10px;
  color:#8b94a3;
  margin-top:3px;
}

.option-arrow{
  margin-left:auto;
  color:#a0a8b5;
  font-size:17px;
}

/* STATUS */
.status{
  margin-top:15px;
  background:white;
  border-radius:18px;
  padding:16px;
  border:1px solid #edf0f5;
  box-shadow:0 5px 18px rgba(16,37,63,.06);
}

.status-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.status-label{
  color:#7b8495;
  font-size:11px;
  font-weight:700;
}

.status-value{
  display:flex;
  align-items:center;
  gap:6px;
  font-size:12px;
  font-weight:800;
  color:#168451;
}

.status-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#18b76b;
}

/* LOADING */
.loading{
  opacity:.55;
}

/* BOTTOM NAV */
.bottom-nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:78px;
  background:rgba(255,253,246,.97);
  border-top:1px solid #e7e2d7;
  z-index:99999;
  display:flex;
  align-items:center;
  justify-content:space-around;
  padding-bottom:env(safe-area-inset-bottom);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
}

.nav-item{
  width:100%;
  max-width:150px;
  height:100%;
  text-decoration:none;
  color:#8b929d;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:5px;
  font-size:13px;
  font-weight:700;
}

.nav-item svg{
  width:27px;
  height:27px;
  stroke:currentColor;
}

.nav-item.active{
  color:#2563eb;
}

/* MOBILE */
@media(max-width:600px){
  .header{
    padding:19px 15px 24px;
  }

  .brand-text{
    font-size:20px;
  }

  .balance-value{
    font-size:21px;
  }

  .nav-item{
    font-size:12px;
  }

  .nav-item svg{
    width:26px;
    height:26px;
  }
}

@media(max-width:360px){
  .balance-grid{
    gap:8px;
  }

  .balance-card{
    padding:15px 12px;
  }

  .balance-value{
    font-size:19px;
  }

  .nav-item{
    font-size:11px;
  }

  .nav-item svg{
    width:24px;
    height:24px;
  }
}
</style>
</head>

<body>

<!-- HEADER -->
<header class="header">

  <div class="header-top">

    <div class="brand">
      <div class="logo-icon">📈</div>

      <div>
        <div class="brand-text">NEXORA</div>
        <div class="brand-sub">BUILD INVEST GROW</div>
      </div>
    </div>

    <button id="logoutButton" class="logout-btn">
      Logout
    </button>

  </div>

  <div class="profile">

    <div class="avatar">
      👤
    </div>

    <div>
      <div id="profileName" class="profile-name">
        Welcome Member!
      </div>

      <div id="profilePhone" class="profile-phone">
        Loading account...
      </div>
    </div>

  </div>

</header>


<!-- MAIN -->
<main class="container">

  <div class="section-title">
    My Balances
  </div>

  <div class="balance-grid">

    <!-- USD -->
    <div class="balance-card usd">

      <div class="balance-label">
        USD Balance
      </div>

      <div id="dollarBalance" class="balance-value loading">
        $0.00
      </div>

      <div class="balance-small">
        Available trading balance
      </div>

    </div>


    <!-- PHP -->
    <div class="balance-card php">

      <div class="balance-label">
        PHP Balance
      </div>

      <div id="pesoBalance" class="balance-value loading">
        ₱0.00
      </div>

      <div class="balance-small">
        Available wallet balance
      </div>

    </div>

  </div>


  <!-- ACCOUNT OPTIONS -->
  <div class="card">

    <button class="option" id="rechargeButton">

      <div class="option-icon">
        +
      </div>

      <div>
        <div class="option-title">
          Recharge
        </div>

        <div class="option-sub">
          Add funds to your account
        </div>
      </div>

      <div class="option-arrow">
        ›
      </div>

    </button>


    <button class="option" id="withdrawButton">

      <div class="option-icon">
        ₱
      </div>

      <div>
        <div class="option-title">
          Withdraw
        </div>

        <div class="option-sub">
          Request a withdrawal
        </div>
      </div>

      <div class="option-arrow">
        ›
      </div>

    </button>


    <button class="option" id="historyButton">

      <div class="option-icon">
        ≡
      </div>

      <div>
        <div class="option-title">
          Transaction History
        </div>

        <div class="option-sub">
          View your account activity
        </div>
      </div>

      <div class="option-arrow">
        ›
      </div>

    </button>

  </div>


  <!-- ACCOUNT STATUS -->
  <div class="status">

    <div class="status-row">

      <div class="status-label">
        ACCOUNT STATUS
      </div>

      <div class="status-value">
        <span class="status-dot"></span>
        Active
      </div>

    </div>

  </div>

</main>


<!-- BOTTOM NAV -->
<nav class="bottom-nav">

  <a href="dashboard.html" class="nav-item">

    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M3 11.5 12 4l9 7.5"></path>
      <path d="M5.5 10.5V20h13v-9.5"></path>
      <path d="M9.5 20v-5.5h5V20"></path>
    </svg>

    <span>Home</span>

  </a>


  <a href="dashboard.html#products" class="nav-item">

    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="3" y="4" width="18" height="16" rx="2"></rect>
      <path d="M3 9h18"></path>
      <path d="M8 14h2"></path>
      <path d="M14 14h2"></path>
    </svg>

    <span>Products</span>

  </a>


  <a href="team.html" class="nav-item">

    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
      <circle cx="9" cy="7" r="4"></circle>
      <path d="M22 21v-2a4 4 0 0 0-3-3.87"></path>
      <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
    </svg>

    <span>Team</span>

  </a>


  <a href="account.html" class="nav-item active">

    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="8" r="4"></circle>
      <path d="M4 21a8 8 0 0 1 16 0"></path>
    </svg>

    <span>Account</span>

  </a>

</nav>


<!-- FIREBASE -->
<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

import {
  getFirestore,
  doc,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";


/* FIREBASE CONFIG */

const firebaseConfig = {
  apiKey: "AIzaSyCIBDQOIiCOgfV4pMCUr0oUCNZoIDYDqGk",
  authDomain: "investpro-2dafb.firebaseapp.com",
  projectId: "investpro-2dafb",
  storageBucket: "investpro-2dafb.firebasestorage.app",
  messagingSenderId: "135092039764",
  appId: "1:135092039764:web:c4c71eef0c904346a77dc1",
  measurementId: "G-0L77SFTC4F"
};


/* INITIALIZE */

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


/* ELEMENTS */

const dollarBalance =
  document.getElementById("dollarBalance");

const pesoBalance =
  document.getElementById("pesoBalance");

const profilePhone =
  document.getElementById("profilePhone");

const logoutButton =
  document.getElementById("logoutButton");


/* FORMAT */

function formatUSD(value){

  const number = Number(value) || 0;

  return "$" + number.toLocaleString("en-US", {
    minimumFractionDigits:2,
    maximumFractionDigits:2
  });

}


function formatPeso(value){

  const number = Number(value) || 0;

  return "₱" + number.toLocaleString("en-PH", {
    minimumFractionDigits:2,
    maximumFractionDigits:2
  });

}


/* AUTH */

onAuthStateChanged(auth, (user) => {

  console.log("ACCOUNT AUTH UID:", user ? user.uid : null);

  if(!user){

    window.location.href = "login.html";

    return;

  }


  profilePhone.textContent =
    user.email || "Member account";


  /*
    USERS/{UID}

    balance      = PHP
    usdBalance   = USD
  */

  const userRef =
    doc(db, "Users", user.uid);


  /*
    REAL-TIME ACCOUNT DATA
  */

  onSnapshot(
    userRef,
    (snapshot) => {

      if(!snapshot.exists()){

        console.error(
          "ACCOUNT: Users document not found:",
          user.uid
        );

        dollarBalance.textContent =
          "$0.00";

        pesoBalance.textContent =
          "₱0.00";

        dollarBalance.classList.remove("loading");
        pesoBalance.classList.remove("loading");

        return;

      }


      const data = snapshot.data() || {};

      console.log(
        "ACCOUNT DATA:",
        data
      );


      /* PHP */

      const phpBalance =
        Number(data.balance) || 0;


      /* USD */

      const usdBalance =
        Number(data.usdBalance) || 0;


      console.log(
        "USD BALANCE:",
        usdBalance
      );

      console.log(
        "PHP BALANCE:",
        phpBalance
      );


      /* DISPLAY */

      dollarBalance.textContent =
        formatUSD(usdBalance);


      pesoBalance.textContent =
        formatPeso(phpBalance);


      dollarBalance.classList.remove("loading");
      pesoBalance.classList.remove("loading");

    },

    (error) => {

      console.error(
        "ACCOUNT FIRESTORE ERROR:",
        error
      );

      dollarBalance.textContent =
        "$0.00";

      pesoBalance.textContent =
        "₱0.00";

      dollarBalance.classList.remove("loading");
      pesoBalance.classList.remove("loading");

    }
  );

});


/* LOGOUT */

logoutButton.addEventListener(
  "click",
  async () => {

    try{

      logoutButton.disabled = true;
      logoutButton.textContent = "Logging out...";

      await signOut(auth);

      window.location.href =
        "login.html";

    }catch(error){

      console.error(
        "LOGOUT ERROR:",
        error
      );

      logoutButton.disabled = false;
      logoutButton.textContent = "Logout";

      alert(
        "Unable to logout. Please try again."
      );

    }

  }
);


/* BUTTONS */

document
  .getElementById("rechargeButton")
  .addEventListener("click", () => {

    window.location.href =
      "recharge.html";

  });


document
  .getElementById("withdrawButton")
  .addEventListener("click", () => {

    window.location.href =
      "withdraw.html";

  });


document
  .getElementById("historyButton")
  .addEventListener("click", () => {

    window.location.href =
      "history.html";

  });

</script>

</body>
</html>
