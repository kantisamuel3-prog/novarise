<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import {
    getAuth,
    onAuthStateChanged,
    signOut
  } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

  import {
    getFirestore,
    doc,
    getDoc
  } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";


  // ==============================
  // FIREBASE CONFIG
  // ==============================

  const firebaseConfig = {
    apiKey: "AIzaSyCIBDQOIiCOgfV4pMCUr0oUCNZoIDYDqGk",
    authDomain: "investpro-2dafb.firebaseapp.com",
    projectId: "investpro-2dafb",
    storageBucket: "investpro-2dafb.firebasestorage.app",
    messagingSenderId: "135092039764",
    appId: "1:135092039764:web:c4c71eef0c904346a77dc1",
    measurementId: "G-0L77SFTC4F"
  };


  // ==============================
  // FIREBASE INITIALIZE
  // ==============================

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);


  // ==============================
  // HELPERS
  // ==============================

  function safeNumber(value) {
    const n = Number(value);
    return Number.isFinite(n) ? n : 0;
  }


  function formatPeso(value) {
    return "₱" + safeNumber(value).toLocaleString("en-PH", {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    });
  }


  function formatUSD(value) {
    return "$" + safeNumber(value).toLocaleString("en-US", {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    });
  }


  // ==============================
  // LOAD USER DATA
  // ==============================

  async function loadAccountData(user) {
    try {

      const userRef = doc(db, "Users", user.uid);
      const userSnap = await getDoc(userRef);

      if (!userSnap.exists()) {
        console.error("Users document not found:", user.uid);

        document.getElementById("dollarBalance").textContent = "$0.00";
        document.getElementById("pesoBalance").textContent = "₱0.00";

        return;
      }

      const data = userSnap.data() || {};

      // Firebase Users/{UID}
      const phpBalance = safeNumber(data.balance);
      const usdBalance = safeNumber(data.usdBalance);

      // Display email
      const emailDisplay = document.getElementById("userEmailDisplay");

      if (emailDisplay) {
        emailDisplay.textContent =
          data.email ||
          user.email ||
          "Member Account";
      }

      // Display USD
      const dollarBalance =
        document.getElementById("dollarBalance");

      if (dollarBalance) {
        dollarBalance.textContent = formatUSD(usdBalance);
      }

      // Display PHP
      const pesoBalance =
        document.getElementById("pesoBalance");

      if (pesoBalance) {
        pesoBalance.textContent = formatPeso(phpBalance);
      }

      console.log("ACCOUNT UID:", user.uid);
      console.log("ACCOUNT DATA:", data);
      console.log("USD BALANCE:", usdBalance);
      console.log("PHP BALANCE:", phpBalance);

    } catch (error) {

      console.error("Failed to load account data:", error);

      document.getElementById("dollarBalance").textContent = "$0.00";
      document.getElementById("pesoBalance").textContent = "₱0.00";
    }
  }


  // ==============================
  // AUTH STATE
  // ==============================

  onAuthStateChanged(auth, async (user) => {

    if (!user) {
      console.log("ACCOUNT: No logged-in user.");
      window.location.href = "index.html";
      return;
    }

    console.log("ACCOUNT AUTH UID:", user.uid);

    await loadAccountData(user);
  });


  // ==============================
  // LOGOUT
  // ==============================

  window.logoutUser = async function() {

    try {
      await signOut(auth);
      window.location.href = "index.html";
    } catch (error) {
      console.error("Logout error:", error);
      window.location.href = "index.html";
    }

  };


  // ==============================
  // OTHER BUTTONS
  // ==============================

  window.openWithdrawModal = function() {
    alert("Withdrawal feature clicked.");
  };

  window.openBankModal = function() {
    alert("Bank / GCash settings clicked.");
  };

  window.openHistoryModal = function() {
    alert("Transaction history clicked.");
  };

  window.openSupport = function() {
    alert("Support clicked.");
  };

  window.openTeam = function() {
    window.location.href = "team.html";
  };

</script>
</body>
</html>
