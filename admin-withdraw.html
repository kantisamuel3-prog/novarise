<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>Novarise — Admin Withdrawals</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
  font-family:Arial,Helvetica,sans-serif;
  background:#f4f7fb;
  color:#172033;
}

body{
  padding:20px 14px 40px;
}

.container{
  width:100%;
  max-width:900px;
  margin:0 auto;
}

.header{
  background:linear-gradient(135deg,#0b2a5b,#1557b0);
  color:#fff;
  border-radius:20px;
  padding:22px 20px;
  margin-bottom:18px;
  box-shadow:0 10px 30px rgba(20,65,130,.15);
}

.logo{
  font-size:25px;
  font-weight:800;
  letter-spacing:.3px;
}

.subtitle{
  margin-top:5px;
  font-size:13px;
  opacity:.82;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-bottom:18px;
}

.stat{
  background:#fff;
  border-radius:16px;
  padding:16px 12px;
  text-align:center;
  box-shadow:0 5px 18px rgba(25,55,100,.07);
}

.stat-label{
  font-size:11px;
  color:#718096;
  margin-bottom:7px;
}

.stat-value{
  font-size:20px;
  font-weight:800;
  color:#123f82;
}

.requests-grid{

  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;

}

.history-toolbar{
  display:flex;
  justify-content:center;
  margin:0 0 18px;
}
.history-toggle{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  width:100%;
  max-width:300px;
  min-height:52px;
  padding:12px 18px;
  border:1px solid #cbdaf0;
  border-radius:15px;
  background:#fff;
  color:#164b91;
  text-decoration:none;
  font-size:14px;
  font-weight:800;
  letter-spacing:.2px;
  box-shadow:0 5px 18px rgba(25,55,100,.08);
  transition:transform .15s ease, box-shadow .15s ease;
}
.history-toggle:active{
  transform:scale(.98);
}
.history-icon{
  font-size:22px;
  line-height:1;
}
.history-arrow{
  font-size:21px;
  line-height:1;
  margin-left:2px;
}
.section{

  background:#fff;
  border-radius:18px;
  padding:17px;
  box-shadow:0 5px 20px rgba(25,55,100,.07);

}

.section-title{
  font-size:18px;
  font-weight:800;
  margin-bottom:14px;
}

.withdrawal-card{
  border:1px solid #e7edf5;
  border-radius:16px;
  padding:15px;
  margin-bottom:12px;
  background:#fff;
}

.withdrawal-card:last-child{
  margin-bottom:0;
}

.card-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:10px;
  margin-bottom:13px;
}

.amount{
  font-size:21px;
  font-weight:800;
  color:#123f82;
}

.status{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:6px 10px;
  border-radius:999px;
  font-size:10px;
  font-weight:800;
  letter-spacing:.4px;
}

.status.pending{
  background:#fff4d6;
  color:#9a6800;
}

.status.approved{
  background:#e5f8ed;
  color:#167542;
}

.status.rejected{
  background:#ffe8e8;
  color:#b42323;
}

.info{
  display:grid;
  gap:7px;
  font-size:13px;
  color:#596579;
}

.info-row{
  display:flex;
  justify-content:space-between;
  gap:12px;
}

.info-row span:first-child{
  color:#8a94a6;
}

.info-row strong{
  color:#273449;
  text-align:right;
  word-break:break-word;
}

.actions{
  display:flex;
  gap:9px;
  margin-top:15px;
}

button{
  flex:1;
  border:0;
  border-radius:11px;
  padding:12px 10px;
  font-size:13px;
  font-weight:800;
  cursor:pointer;
}

.approve-btn{
  background:#16834a;
  color:#fff;
}

.reject-btn{
  background:#e34b4b;
  color:#fff;
}

button:disabled{
  opacity:.55;
  cursor:not-allowed;
}

.empty{
  text-align:center;
  padding:30px 15px;
  color:#7d8797;
  font-size:14px;
}

.error{
  background:#fff0f0;
  border:1px solid #ffcaca;
  color:#a62222;
  border-radius:14px;
  padding:16px;
  text-align:center;
  font-size:14px;
  line-height:1.5;
}

.loading{
  text-align:center;
  padding:30px 15px;
  color:#738096;
  font-size:14px;
}

@media(max-width:600px){

  body{
    padding:12px 10px 30px;
  }

  .header{
    padding:19px 16px;
    border-radius:17px;
  }

  .logo{
    font-size:22px;
  }

  .stats{
    gap:7px;
  }

  .stat{
    padding:13px 7px;
    border-radius:13px;
  }

  .stat-label{
    font-size:9px;
  }

  .stat-value{
    font-size:17px;
  }

  .section{
    padding:13px;
    border-radius:16px;
  }

  .withdrawal-card{
    padding:13px;
  }

  .amount{
    font-size:19px;
  }

  .info-row{
    align-items:flex-start;
  }

  .info-row span:first-child{
    flex-shrink:0;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <div class="logo">Novarise</div>
    <div class="subtitle">Withdrawal Administration</div>
  </div>

  <div class="history-toolbar">
    <a href="history.html" class="history-toggle" onclick="openHistory(); return false;">
      <span class="history-icon">↻</span>
      <span>VIEW HISTORY</span>
      <span class="history-arrow">→</span>
    </a>
  </div>

  <div class="stats">

    <div class="stat">
      <div class="stat-label">PENDING</div>
      <div class="stat-value" id="pendingCount">0</div>
    </div>

    <div class="stat">
      <div class="stat-label">PENDING AMOUNT</div>
      <div class="stat-value" id="pendingAmount">₱0.00</div>
    </div>

    <div class="stat">
      <div class="stat-label">TOTAL REQUESTS</div>
      <div class="stat-value" id="totalCount">0</div>
    </div>

  </div>

<div class="requests-grid">

      
<!-- =========================
     RECHARGE REQUESTS
========================= -->

<div class="section">

    <div class="section-title">
      Recharge Requests
    </div>

    <div id="recharges">

      <div class="loading">
        Loading recharge requests...
      </div>

    </div>

  </div>


  <!-- =========================
       WITHDRAWAL REQUESTS
  ========================= -->

  <div class="section">

    <div class="section-title">
      Withdrawal Requests
    </div>

    <div id="withdrawals">

      <div class="loading">
        Loading withdrawal requests...
      </div>

    </div>

  </div>

</div>


<!-- Firebase Compat SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>


<script>

const firebaseConfig = {

  apiKey:
    "AIzaSyCIBDQOIiCOgfV4pMCUr0oUCNZoIDYDqGk",

  authDomain:
    "investpro-2dafb.firebaseapp.com",

  projectId:
    "investpro-2dafb",

  storageBucket:
    "investpro-2dafb.firebasestorage.app",

  messagingSenderId:
    "135092039764",

  appId:
    "1:135092039764:web:c4c71eef0c904346a77dc1",

  measurementId:
    "G-0L77SFTC4F"

};


firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();


const ADMIN_EMAIL =
  "639999999999@nexora.local";


const $ = id =>
  document.getElementById(id);


/* -----------------------------------------
   MONEY FORMAT
----------------------------------------- */

function formatMoney(value){

  const amount =
    Number(value || 0);

  return "₱" +
    amount.toLocaleString(
      "en-PH",
      {
        minimumFractionDigits:2,
        maximumFractionDigits:2
      }
    );

}


/* -----------------------------------------
   AUTH CHECK
----------------------------------------- */

(async function(){

  try{

    await auth.setPersistence(
      firebase.auth.Auth.Persistence.LOCAL
    );

    let user = auth.currentUser;

    if(!user){

      user = await new Promise(resolve => {

        let finished = false;

        const unsubscribe =
          auth.onAuthStateChanged(
            currentUser => {

              if(finished) return;

              finished = true;

              unsubscribe();

              resolve(
                currentUser || null
              );

            }
          );

        setTimeout(() => {

          if(finished) return;

          finished = true;

          unsubscribe();

          resolve(
            auth.currentUser || null
          );

        },8000);

      });

    }

    console.log(
      "ADMIN AUTH USER:",
      user
    );

    if(!user){

      $("withdrawals").innerHTML = `
        <div class="error">
          Please login first using the existing Novarise login page.
        </div>
      `;

      $("recharges").innerHTML = `
        <div class="error">
          Please login first using the existing Novarise login page.
        </div>
      `;

      $("pendingCount").textContent = "0";
      $("pendingAmount").textContent = "₱0.00";
      $("totalCount").textContent = "0";

      return;

    }

    await user.getIdToken(true);

    console.log(
      "ADMIN EMAIL:",
      user.email
    );

    if(
      user.email !==
      ADMIN_EMAIL
    ){

      $("withdrawals").innerHTML = `
        <div class="error">
          Access denied.<br><br>
          This page is for the withdrawal administrator only.
        </div>
      `;

      $("recharges").innerHTML = `
        <div class="error">
          Access denied.
        </div>
      `;

      $("pendingCount").textContent = "0";
      $("pendingAmount").textContent = "₱0.00";
      $("totalCount").textContent = "0";

      return;

    }

    console.log(
      "ADMIN VERIFIED"
    );

    await loadWithdrawals();

  }catch(error){

    console.error(
      "Firebase Auth restore error:",
      error
    );

    $("withdrawals").innerHTML = `
      <div class="error">
        Unable to restore the administrator login session.
        Please refresh the page.
      </div>
    `;

    $("recharges").innerHTML = `
      <div class="error">
        Unable to restore the administrator login session.
        Please refresh the page.
      </div>
    `;

    $("pendingCount").textContent = "0";
    $("pendingAmount").textContent = "₱0.00";
    $("totalCount").textContent = "0";

  }

})();

/* -----------------------------------------
   HISTORY DATA
----------------------------------------- */

let adminHistoryRecharge = [];
let adminHistoryWithdrawal = [];

function openHistory(){

  try{

    sessionStorage.setItem(
      "novariseAdminHistory",
      JSON.stringify({
        recharge: adminHistoryRecharge,
        withdrawal: adminHistoryWithdrawal
      })
    );

  }catch(error){
    console.error("Unable to prepare history data:", error);
  }

  window.location.href = "history.html";
}

/* -----------------------------------------
   LOAD ALL REQUESTS
----------------------------------------- */

async function loadWithdrawals(){

  $("withdrawals").innerHTML = `
    <div class="loading">
      Loading withdrawal requests...
    </div>
  `;


  $("recharges").innerHTML = `
    <div class="loading">
      Loading recharge requests...
    </div>
  `;


  try{

    const snapshot =
      await db
        .collection("Users")
        .get();


    const requests = [];

    const rechargeRequests = [];


    snapshot.forEach(
      UserDoc => {

        const UserData =
          UserDoc.data() || {};


        const transactions =
          Array.isArray(
            UserData.transactions
          )
            ? UserData.transactions
            : [];


        transactions.forEach(
          (transaction,index) => {


            if(
              transaction &&
              transaction.type ===
                "Withdrawal Request"
            ){

              requests.push({

                UserId:
                  UserDoc.id,

                transactionIndex:
                  index,

                UserName:
                  UserData.name ||
                  UserData.displayName ||
                  "Member",

                ...transaction

              });

            }


            if(
              transaction &&
              transaction.type ===
                "Recharge"
            ){

              rechargeRequests.push({

                UserId:
                  UserDoc.id,

                transactionIndex:
                  index,

                UserName:
                  UserData.name ||
                  UserData.displayName ||
                  "Member",

                ...transaction

              });

            }

          }
        );

      }
    );


    /*
      Newest withdrawals first.
    */

    requests.sort(
      (a,b) => {

        const dateA =
          new Date(
            a.date || 0
          ).getTime();


        const dateB =
          new Date(
            b.date || 0
          ).getTime();


        return dateB - dateA;

      }
    );


    /*
      Newest recharge requests first.
    */

    rechargeRequests.sort(
      (a,b) => {

        const dateA =
          new Date(
            a.date || 0
          ).getTime();


        const dateB =
          new Date(
            b.date || 0
          ).getTime();


        return dateB - dateA;

      }
    );


    const pendingWithdrawals = requests.filter(request =>
      String(request.status || "PENDING").toUpperCase() === "PENDING"
    );
    const pendingRecharges = rechargeRequests.filter(request =>
      String(request.status || "PENDING").toUpperCase() === "PENDING"
    );
    const processedWithdrawals = requests.filter(request =>
      ["APPROVED", "REJECTED"].includes(String(request.status || "").toUpperCase())
    );
    const processedRecharges = rechargeRequests.filter(request =>
      ["APPROVED", "REJECTED"].includes(String(request.status || "").toUpperCase())
    );

    adminHistoryWithdrawal = processedWithdrawals;
    adminHistoryRecharge = processedRecharges;

    updateStats(requests);

    if(pendingWithdrawals.length === 0){
      $("withdrawals").innerHTML = '<div class="empty">No pending withdrawal requests.</div>';
    }else{
      $("withdrawals").innerHTML = pendingWithdrawals
        .map((request,index) => renderWithdrawal(request,index)).join("");
    }

    if(pendingRecharges.length === 0){
      $("recharges").innerHTML = '<div class="empty">No pending recharge requests.</div>';
    }else{
      $("recharges").innerHTML = pendingRecharges
        .map((request,index) => renderRecharge(request,index)).join("");
    }

  }catch(error){

    console.error(
      "Load requests error:",
      error
    );


    $("withdrawals").innerHTML = `
      <div class="error">
        Failed to load withdrawal requests.<br>
        Please check your Firebase permissions.
      </div>
    `;


    $("recharges").innerHTML = `
      <div class="error">
        Failed to load recharge requests.<br>
        Please check your Firebase permissions.
      </div>
    `;

  }

}


/* -----------------------------------------
   STATS
----------------------------------------- */

function updateStats(requests){

  const pending =
    requests.filter(
      request =>
        String(
          request.status || ""
        ).toUpperCase() ===
        "PENDING"
    );


  const pendingAmount =
    pending.reduce(
      (sum,request) =>
        sum +
        Number(
          request.amount || 0
        ),
      0
    );


  $("pendingCount").textContent =
    pending.length;


  $("pendingAmount").textContent =
    formatMoney(
      pendingAmount
    );


  $("totalCount").textContent =
    requests.length;

}


/* -----------------------------------------
   RENDER RECHARGE
----------------------------------------- */

function renderRecharge(
  request,
  index
){

  const status =
    String(
      request.status ||
      "PENDING"
    ).toUpperCase();


  let statusClass =
    "pending";


  if(
    status ===
    "APPROVED"
  ){

    statusClass =
      "approved";

  }


  if(
    status ===
    "REJECTED"
  ){

    statusClass =
      "rejected";

  }


  const date =
    request.date
      ? new Date(
          request.date
        ).toLocaleString(
          "en-PH"
        )
      : "—";


  const amount =
    formatMoney(
      request.amount
    );


  const orderId =
    request.orderId ||
    "—";


  const method =
    request.method ||
    "GCash";


  let actions =
    "";


  if(
    status ===
    "PENDING"
  ){

    actions = `

<div class="actions">

<button
type="button"
class="approve-btn approve-recharge-btn"
data-userid="${escapeHtml(request.UserId)}"
data-orderid="${escapeHtml(request.orderId || "")}"
data-amount="${Number(request.amount || 0)}"
data-index="${index}">
APPROVE
</button>


<button
type="button"
class="reject-btn reject-recharge-btn"
data-userid="${escapeHtml(request.UserId)}"
data-orderid="${escapeHtml(request.orderId || "")}"
data-index="${index}">
REJECT
</button>

</div>

`;


  }


  return `

    <div class="withdrawal-card">

      <div class="card-top">

        <div>

          <div class="amount">
            ${amount}
          </div>

        </div>


        <div class="status ${statusClass}">
          ${escapeHtml(status)}
        </div>

      </div>


      <div class="info">

        <div class="info-row">

          <span>
            Member
          </span>

          <strong>
            ${escapeHtml(
              request.UserName ||
              "Member"
            )}
          </strong>

        </div>


        <div class="info-row">

          <span>
            Method
          </span>

          <strong>
            ${escapeHtml(method)}
          </strong>

        </div>


        <div class="info-row">

          <span>
            Order ID
          </span>

          <strong>
            ${escapeHtml(orderId)}
          </strong>

        </div>


        <div class="info-row">

          <span>
            Date
          </span>

          <strong>
            ${escapeHtml(date)}
          </strong>

        </div>

      </div>


      ${actions}

    </div>

  `;

}


/* -----------------------------------------
   RECHARGE BUTTON HANDLER
----------------------------------------- */

$("recharges").addEventListener(
  "click",
  function(event){


    const approveButton =
      event.target.closest(
        ".approve-recharge-btn"
      );


    const rejectButton =
      event.target.closest(
        ".reject-recharge-btn"
      );


    if(
      !approveButton &&
      !rejectButton
    )
      return;



    const button =
      approveButton ||
      rejectButton;



    const UserId =
      button.dataset.userid;


    const orderId =
      button.dataset.orderid;


    const amount =
      Number(
        button.dataset.amount || 0
      );


    const index =
      Number(
        button.dataset.index
      );



    if(approveButton){

      approveRecharge(
        UserId,
        orderId,
        amount,
        index
      );

    }



    if(rejectButton){

      rejectRecharge(
        UserId,
        orderId,
        index
      );

    }


  }
);


/* -----------------------------------------
   RENDER WITHDRAWAL
----------------------------------------- */

function renderWithdrawal(
  request,
  index
){

  const status =
    String(
      request.status ||
      "PENDING"
    ).toUpperCase();


  let statusClass =
    "pending";


  if(
    status ===
    "APPROVED"
  ){

    statusClass =
      "approved";

  }


  if(
    status ===
    "REJECTED"
  ){

    statusClass =
      "rejected";

  }


  const date =
    request.date
      ? new Date(
          request.date
        ).toLocaleString(
          "en-PH"
        )
      : "—";


  const amount =
    formatMoney(
      request.amount
    );


  const requestId =
    request.requestId ||
    "—";


  const method =
    request.method ||
    "—";


  const accountName =
    request.accountName ||
    "—";


  const accountNumber =
    request.accountNumber ||
    "—";


  let actions =
    "";


  if(
    status ===
    "PENDING"
  ){

    actions = `

      <div class="actions">

        <button
          type="button"
          class="approve-btn"
          id="approve-${index}"
          onclick="approveWithdrawal(
            '${escapeAttribute(request.UserId)}',
            '${escapeAttribute(request.requestId || "")}',
            ${Number(request.amount || 0)},
            ${index}
          )">
          APPROVE
        </button>


        <button
          type="button"
          class="reject-btn"
          id="reject-${index}"
          onclick="rejectWithdrawal(
            '${escapeAttribute(request.UserId)}',
            '${escapeAttribute(request.requestId || "")}',
            ${Number(request.amount || 0)},
            ${index}
          )">
          REJECT
        </button>

      </div>

    `;

  }


  return `

    <div class="withdrawal-card">

      <div class="card-top">

        <div>

          <div class="amount">
            ${amount}
          </div>

        </div>


        <div class="status ${statusClass}">
          ${status}
        </div>

      </div>


      <div class="info">

        <div class="info-row">

          <span>
            Member
          </span>

          <strong>
            ${escapeHtml(
              request.UserName
            )}
          </strong>

        </div>


        <div class="info-row">

          <span>
            Method
          </span>

          <strong>
            ${escapeHtml(
              method
            )}
          </strong>

        </div>


        <div class="info-row">

          <span>
            Account Name
          </span>

          <strong>
            ${escapeHtml(
              accountName
            )}
          </strong>

        </div>


        <div class="info-row">

          <span>
            Account Number
          </span>

          <strong>
            ${escapeHtml(
              accountNumber
            )}
          </strong>

        </div>


        <div class="info-row">

          <span>
            Request ID
          </span>

          <strong>
            ${escapeHtml(
              requestId
            )}
          </strong>

        </div>


        <div class="info-row">

          <span>
            Date
          </span>

          <strong>
            ${escapeHtml(
              date
            )}
          </strong>

        </div>

      </div>


      ${actions}

    </div>

  `;

}


/* -----------------------------------------
   APPROVE WITHDRAWAL
----------------------------------------- */

async function approveWithdrawal(
  UserId,
  requestId,
  amount,
  index
){

  const approveButton =
    $("approve-" + index);


  const rejectButton =
    $("reject-" + index);


  if(approveButton)
    approveButton.disabled =
      true;


  if(rejectButton)
    rejectButton.disabled =
      true;


  try{

    const UserRef =
      db.collection("Users")
        .doc(UserId);


    await db.runTransaction(
      async transaction => {

        const snap =
          await transaction.get(
            UserRef
          );


        if(!snap.exists){

          throw new Error(
            "USER_NOT_FOUND"
          );

        }


        const data =
          snap.data() || {};


        const transactions =
          Array.isArray(
            data.transactions
          )
            ? [...data.transactions]
            : [];


        const transactionIndex =
          transactions.findIndex(
            item =>
              item &&
              item.type ===
                "Withdrawal Request" &&
              item.requestId ===
                requestId
          );


        if(
          transactionIndex ===
          -1
        ){

          throw new Error(
            "REQUEST_NOT_FOUND"
          );

        }


        const request =
          transactions[
            transactionIndex
          ];


        const currentStatus =
          String(
            request.status ||
            "PENDING"
          ).toUpperCase();


        if(
          currentStatus !==
          "PENDING"
        ){

          throw new Error(
            "ALREADY_PROCESSED"
          );

        }


        transactions[
          transactionIndex
        ] = {

          ...request,

          status:
            "APPROVED",

          approvedAt:
            new Date()
              .toISOString()

        };


        /*
          IMPORTANT:
          APPROVE DOES NOT DEDUCT BALANCE AGAIN.

          Balance was already deducted
          when the withdrawal request
          was submitted.
        */

        transaction.update(
          UserRef,
          {
            transactions
          }
        );

      }
    );


    await loadWithdrawals();


  }catch(error){

    console.error(
      "Approve error:",
      error
    );


    if(
      error.message ===
      "ALREADY_PROCESSED"
    ){

      alert(
        "This withdrawal request has already been processed."
      );

    }else{

      alert(
        "Failed to approve this withdrawal request."
      );

    }


    await loadWithdrawals();

  }

}


/* -----------------------------------------
   APPROVE RECHARGE
----------------------------------------- */

async function approveRecharge(
  UserId,
  orderId,
  amount,
  index
){

  if(
    !UserId ||
    !orderId
  ){

    alert(
      "Invalid recharge request."
    );

    return;

  }


  const rechargeAmount =
    Number(amount);


  if(
    !Number.isFinite(
      rechargeAmount
    ) ||
    rechargeAmount <= 0
  ){

    alert(
      "Invalid recharge amount."
    );

    return;

  }


  const userRef =
    db.collection("Users")
      .doc(UserId);


  try{

    await db.runTransaction(
      async transaction => {

        const snap =
          await transaction.get(
            userRef
          );


        if(!snap.exists){

          throw new Error(
            "USER_NOT_FOUND"
          );

        }


        const data =
          snap.data() || {};


        const transactions =
          Array.isArray(
            data.transactions
          )
            ? [...data.transactions]
            : [];


        const rechargeIndex =
          transactions.findIndex(
            item =>
              item &&
              item.type ===
                "Recharge" &&
              item.orderId ===
                orderId
          );


        if(
          rechargeIndex ===
          -1
        ){

          throw new Error(
            "RECHARGE_NOT_FOUND"
          );

        }


        const recharge =
          transactions[
            rechargeIndex
          ];


        const currentStatus =
          String(
            recharge.status ||
            "PENDING"
          ).toUpperCase();


        if(
          currentStatus !==
          "PENDING"
        ){

          throw new Error(
            "RECHARGE_ALREADY_PROCESSED"
          );

        }


        const currentBalance =
          Number(
            data.balance || 0
          );


        transactions[
          rechargeIndex
        ] = {

          ...recharge,

          status:
            "APPROVED",

          approvedAt:
            new Date()
              .toISOString()

        };


        transaction.update(
          userRef,
          {

            balance:
              currentBalance +
              rechargeAmount,

            transactions

          }
        );

      }
    );


    await loadWithdrawals();


    alert(
      "Recharge approved successfully."
    );


  }catch(error){

    console.error(
      "Approve recharge error:",
      error
    );


    if(
      error.message ===
      "RECHARGE_ALREADY_PROCESSED"
    ){

      alert(
        "This recharge has already been processed."
      );

    }else if(
      error.message ===
      "RECHARGE_NOT_FOUND"
    ){

      alert(
        "Recharge request was not found."
      );

    }else if(
      error.message ===
      "USER_NOT_FOUND"
    ){

      alert(
        "Member account was not found."
      );

    }else{

      alert(
        "Unable to approve recharge."
      );

    }

  }

}

----------------------------------------- */

async function rejectWithdrawal(
  UserId,
  requestId,
  amount,
  index
){

  const approveButton =
    $("approve-" + index);


  const rejectButton =
    $("reject-" + index);


  if(approveButton)
    approveButton.disabled =
      true;


  if(rejectButton)
    rejectButton.disabled =
      true;


  try{

    const UserRef =
      db.collection("Users")
        .doc(UserId);


    await db.runTransaction(
      async transaction => {

        const snap =
          await transaction.get(
            UserRef
          );


        if(!snap.exists){

          throw new Error(
            "USER_NOT_FOUND"
          );

        }


        const data =
          snap.data() || {};


        const transactions =
          Array.isArray(
            data.transactions
          )
            ? [...data.transactions]
            : [];


        const transactionIndex =
          transactions.findIndex(
            item =>
              item &&
              item.type ===
                "Withdrawal Request" &&
              item.requestId ===
                requestId
          );


        if(
          transactionIndex ===
          -1
        ){

          throw new Error(
            "REQUEST_NOT_FOUND"
          );

        }


        const request =
          transactions[
            transactionIndex
          ];


        const currentStatus =
          String(
            request.status ||

          ).toUpperCase();


        if(
          currentStatus !==
          "PENDING"
        ){

          throw new Error(
            "ALREADY_PROCESSED"
          );

        }


        const currentBalance =

        transactions[

        "This withdrawal request has already been processed."
      );

      );

/* -----------------------------------------
   SECURITY / DISPLAY HELPERS
----------------------------------------- */

function escapeHtml(value){

  return String(
    value ?? ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


function escapeAttribute(value){

  return String(
    value ?? ""
  )
    .replace(
      /\\/g,
      "\\\\"
    )
    .replace(
      /'/g,
      "\\'"
    );

}
