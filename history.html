<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Nexora — History</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:#050b14;color:#e2e8f0}
body{padding:16px 14px 70px}
.container{width:100%;max-width:980px;margin:0 auto}

/* Header style katulad ng team/account */
.header{background:linear-gradient(135deg,#0d233a,#133b63);color:#fff;border-radius:20px;padding:18px 20px;margin-bottom:16px;box-shadow:0 10px 30px rgba(0,0,0,.4);border:1px solid #1a365d}
.topbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}
.back{display:inline-flex;align-items:center;justify-content:center;justify-self:start;min-width:84px;height:38px;padding:0 12px;border-radius:10px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:#fff;text-decoration:none;font-size:12px;font-weight:700}
.back:hover{background:rgba(255,255,255,.15)}
.title-wrap{text-align:center}
.logo{font-size:22px;font-weight:800;line-height:1.15;color:#38bdf8}
.subtitle{margin-top:4px;font-size:13px;font-weight:600;opacity:.8}

/* Tabs para sa mga kategorya */
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:16px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab-btn{background:#0b192c;border:1px solid #1e3a5f;color:#94a3b8;padding:9px 15px;border-radius:12px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;transition:all .2s}
.tab-btn.active{background:#0284c7;color:#fff;border-color:#38bdf8;box-shadow:0 4px 12px rgba(2,132,199,.3)}

/* Section at Cards style katulad ng team.html */
.section{background:#0b192c;border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 8px 24px rgba(0,0,0,.3);border:1px solid #162a45}
.section-title{font-size:16px;font-weight:800;margin-bottom:12px;color:#38bdf8}

.card{border:1px solid #1b3353;border-radius:14px;padding:14px;margin-bottom:10px;background:#0e1e35}
.card:last-child{margin-bottom:0}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}
.amount{font-size:18px;font-weight:800;color:#38bdf8}
.status{display:inline-flex;align-items:center;justify-content:center;padding:4px 10px;border-radius:999px;font-size:10px;font-weight:800;letter-spacing:.3px}
.status.approved,.status.success{background:rgba(22,163,74,.15);color:#4ade80;border:1px solid rgba(74,222,128,.3)}
.status.pending{background:rgba(234,179,8,.15);color:#facc15;border:1px solid rgba(250,204,21,.3)}
.status.rejected{background:rgba(220,38,38,.15);color:#f87171;border:1px solid rgba(248,113,113,.3)}

.info{display:grid;gap:6px;font-size:12px;color:#94a3b8}
.info-row{display:flex;justify-content:space-between;gap:12px}
.info-row span:first-child{color:#64748b}
.info-row strong{color:#cbd5e1;text-align:right;word-break:break-word}

.empty{text-align:center;padding:24px 15px;color:#64748b;font-size:13px}
.loading{text-align:center;padding:24px 15px;color:#64748b;font-size:13px}
.error{background:rgba(220,38,38,.1);border:1px solid rgba(220,38,38,.3);color:#f87171;border-radius:12px;padding:14px;text-align:center;font-size:13px}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="topbar">
      <a href="account.html" class="back">← BACK</a>
      <div class="title-wrap">
        <div class="logo">Nexora</div>
        <div class="subtitle">Transaction History</div>
      </div>
      <div></div>
    </div>
  </div>

  <!-- Mga Filter Tabs -->
  <div class="tabs">
    <button class="tab-btn active" onclick="filterHistory('all')">All</button>
    <button class="tab-btn" onclick="filterHistory('Recharge')">Recharge</button>
    <button class="tab-btn" onclick="filterHistory('Withdrawal Request')">Withdrawals</button>
    <button class="tab-btn" onclick="filterHistory('Convert')">Convert</button>
  </div>

  <div class="section">
    <div class="section-title" id="sectionTitle">All Transactions</div>
    <div id="transactionHistory"><div class="loading">Loading history...</div></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyCIBDQOIiCOgfV4pMCUr0oUCNZoIDYDgKqGk",authDomain:"investpro-2dafb.firebaseapp.com",projectId:"investpro-2dafb",storageBucket:"investpro-2dafb.firebasestorage.app",messagingSenderId:"135092039764",appId:"1:135092039764:web:c4c71eef0c904346a77dc1",measurementId:"G-0L77SFTC4F"};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(),db=firebase.firestore();
const $=id=>document.getElementById(id);

let allTransactions = [];

function money(v){
  const num = Number(v||0);
  return "₱" + num.toLocaleString("en-PH",{minimumFractionDigits:2,maximumFractionDigits:2});
}

function esc(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}
function dateText(v){if(!v)return"—";const d=new Date(v);return isNaN(d)?"—":d.toLocaleString("en-PH")}

function renderCard(r){
  const type = String(r.type || "Transaction");
  const s = String(r.status || "SUCCESS").toUpperCase();
  let statusClass = "success";
  if(s === "APPROVED") statusClass = "approved";
  else if(s === "PENDING") statusClass = "pending";
  else if(s === "REJECTED") statusClass = "rejected";

  let displayAmount = money(r.amount);
  let extraDetails = "";

  if(type === "Recharge"){
    extraDetails = `<div class="info-row"><span>Method</span><strong>${esc(r.method || "GCash")}</strong></div><div class="info-row"><span>Order ID</span><strong>${esc(r.orderId ||"—")}</strong></div>`;
  } else if(type === "Withdrawal Request"){
    extraDetails = `<div class="info-row"><span>Account Name</span><strong>${esc(r.accountName ||"—")}</strong></div><div class="info-row"><span>Account Number</span><strong>${esc(r.accountNumber ||"—")}</strong></div>`;
  } else if(type.toLowerCase().includes("convert")){
    extraDetails = `<div class="info-row"><span>Details</span><strong>${esc(r.details || type)}</strong></div>`;
  } else {
    extraDetails = `<div class="info-row"><span>Type</span><strong>${esc(type)}</strong></div>`;
  }

  return `
    <div class="card">
      <div class="card-top">
        <div class="amount">${displayAmount}</div>
        <div class="status ${statusClass}">${esc(s)}</div>
      </div>
      <div class="info">
        <div class="info-row"><span>Type</span><strong>${esc(type)}</strong></div>
        ${extraDetails}
        <div class="info-row"><span>Date</span><strong>${esc(dateText(r.date || r.timestamp))}</strong></div>
      </div>
    </div>
  `;
}

function filterHistory(type){
  document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
  event.target.classList.add('active');

  let filtered = allTransactions;
  if(type !== 'all'){
    filtered = allTransactions.filter(item => {
      const t = String(item.type || "");
      if(type === 'Convert') return t.toLowerCase().includes('convert');
      return t === type;
    });
    $("sectionTitle").innerText = type === 'Convert' ? "Convert History" : type + " History";
  } else {
    $("sectionTitle").innerText = "All Transactions";
  }

  $("transactionHistory").innerHTML = filtered.length
    ? filtered.map(renderCard).join("")
    : '<div class="empty">Walang nakitang kasaysayan sa kategoryang ito.</div>';
}

async function loadUserHistory(){
  auth.onAuthStateChanged(async user => {
    if(!user){
      $("transactionHistory").innerHTML = '<div class="error">Mangyaring mag-log in upang makita ang iyong kasaysayan.</div>';
      return;
    }

    try {
      const userDoc = await db.collection("Users").doc(user.uid).get();
      if(!userDoc.exists){
        $("transactionHistory").innerHTML = '<div class="empty">Hindi nahanap ang datos ng account.</div>';
        return;
      }

      const data = userDoc.data() || {};
      const txs = Array.isArray(data.transactions) ? data.transactions : [];
      const conversions = Array.isArray(data.conversions) ? data.conversions : [];
      
      allTransactions = [...txs, ...conversions];
      allTransactions.sort((a, b) => new Date(b.date || b.timestamp || 0) - new Date(a.date || a.timestamp || 0));

      $("transactionHistory").innerHTML = allTransactions.length
        ? allTransactions.map(renderCard).join("")
        : '<div class="empty">Wala pang naitalang transaksyon.</div>';

    } catch(err){
      console.error("Load history error:", err);
      $("transactionHistory").innerHTML = '<div class="error">Hindi ma-load ang kasaysayan. Subukan muli.</div>';
    }
  });
}

loadUserHistory();
</script>
</body>
</html>
