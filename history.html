  <!-- BACKGROUND CHART SCRIPT -->
  <script>
      const canvas = document.getElementById('chartCanvas');
      const ctx = canvas.getContext('2d');
      function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
      window.addEventListener('resize', resizeCanvas);
      resizeCanvas();

      let candles = [];
      const candleWidth = 14, spacing = 22;
      function initCandles() {
          candles = [];
          const count = Math.ceil(canvas.width / spacing) + 5;
          let currentPrice = canvas.height * 0.55;
          for (let i = 0; i < count; i++) {
              const open = currentPrice;
              const close = open + (Math.random() - 0.48) * 35;
              const high = Math.max(open, close) + Math.random() * 15;
              const low = Math.min(open, close) - Math.random() * 15;
              candles.push({ open, close, high, low, x: i * spacing });
              currentPrice = close;
          }
      }
      function drawChart() {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          for (let i = 0; i < candles.length; i++) {
              const c = candles[i];
              const isBullish = c.close <= c.open;
              ctx.strokeStyle = isBullish ? '#00e676' : '#ff5252';
              ctx.fillStyle = isBullish ? 'rgba(0, 230, 118, 0.5)' : 'rgba(255, 82, 82, 0.5)';
              ctx.beginPath();
              ctx.moveTo(c.x + candleWidth / 2, c.high);
              ctx.lineTo(c.x + candleWidth / 2, c.low);
              ctx.stroke();
              const bodyY = Math.min(c.open, c.close);
              const bodyHeight = Math.max(Math.abs(c.open - c.close), 2);
              ctx.fillRect(c.x, bodyY, candleWidth, bodyHeight);
              c.x -= 0.4;
          }
          if (candles.length > 0 && candles[0].x < -spacing) {
              const last = candles[candles.length - 1];
              const open = last.close;
              const close = open + (Math.random() - 0.48) * 35;
              const high = Math.max(open, close) + Math.random() * 15;
              const low = Math.min(open, close) - Math.random() * 15;
              candles.shift();
              candles.push({ open, close, high, low, x: last.x + spacing });
          }
          requestAnimationFrame(drawChart);
      }
      initCandles();
      drawChart();
  </script>

  <!-- FIREBASE DATA LOADING & FILTERING -->
  <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
      import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
      import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

      const firebaseConfig = {
          apiKey: "AIzaSyCIBDQOIiCOgfV4pMCUr0oUCNZoIDYDqGk",
          authDomain: "investpro-2dafb.firebaseapp.com",
          projectId: "investpro-2dafb",
          storageBucket: "investpro-2dafb.firebasestorage.app",
          messagingSenderId: "135092039764",
          appId: "1:135092039764:web:c4c71eef0c904346a77dc1"
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);

      let allTransactions = [];
      const historyContainer = document.getElementById("transactionHistory");

      function formatMoney(amount) {
          return "₱" + Number(amount || 0).toLocaleString("en-PH", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      }

      function formatDate(timestamp) {
          if (!timestamp) return "—";
          const d = new Date(timestamp);
          return isNaN(d) ? "—" : d.toLocaleString("en-PH");
      }

      function esc(str) {
          return String(str ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      }

      window.filterHistory = function(type) {
          document.querySelectorAll('.tab-btn').forEach(btn => {
              btn.classList.remove('bg-nexora-cyan', 'text-slate-950', 'shadow-[0_0_10px_rgba(0,242,254,0.4)]');
              btn.classList.add('bg-nexora-card', 'border', 'border-nexora-cyan/30', 'text-gray-300');
          });
          event.currentTarget.classList.remove('bg-nexora-card', 'border', 'border-nexora-cyan/30', 'text-gray-300');
          event.currentTarget.classList.add('bg-nexora-cyan', 'text-slate-950', 'shadow-[0_0_10px_rgba(0,242,254,0.4)]');

          let filtered = allTransactions;
          if (type !== 'all') {
              filtered = allTransactions.filter(item => {
                  const t = String(item.type || "");
                  if (type === 'Convert') return t.toLowerCase().includes('convert');
                  return t === type;
              });
          }

          renderTransactions(filtered);
      }

      function renderTransactions(list) {
          if (!list || list.length === 0) {
              historyContainer.innerHTML = '<div class="text-center py-8 text-gray-400 text-xs font-mono">No transaction records found.</div>';
              return;
          }

          historyContainer.innerHTML = list.map(r => {
              const type = esc(r.type || "Transaction");
              const status = esc(String(r.status || "SUCCESS").toUpperCase());
              
              let statusColor = "bg-emerald-500/15 text-emerald-400 border-emerald-500/30";
              if (status === "PENDING") statusColor = "bg-yellow-500/15 text-yellow-400 border-yellow-500/30";
              if (status === "REJECTED") statusColor = "bg-red-500/15 text-red-400 border-red-500/30";

              let detailsHTML = "";
              if (type === "Recharge") {
                  detailsHTML = `<div class="flex justify-between text-[11px] font-mono"><span class="text-gray-400">Gateway</span><span class="text-white">${esc(r.method || "GCash")}</span></div>
                                 <div class="flex justify-between text-[11px] font-mono"><span class="text-gray-400">Order ID</span><span class="text-white">${esc(r.orderId || "—")}</span></div>`;
              } else if (type === "Withdrawal Request") {
                  detailsHTML = `<div class="flex justify-between text-[11px] font-mono"><span class="text-gray-400">Account Name</span><span class="text-white">${esc(r.accountName || "—")}</span></div>
                                 <div class="flex justify-between text-[11px] font-mono"><span class="text-gray-400">Account No.</span><span class="text-white">${esc(r.accountNumber || "—")}</span></div>`;
              } else {
                  detailsHTML = `<div class="flex justify-between text-[11px] font-mono"><span class="text-gray-400">Details</span><span class="text-white">${esc(r.details || type)}</span></div>`;
              }

              return `
                  <div class="rounded-xl p-3.5 bg-nexora-card/90 border border-nexora-cyan/20 shadow-lg backdrop-blur-md space-y-2">
                      <div class="flex items-center justify-between pb-2 border-b border-white/5">
                          <div>
                              <span class="text-[9px] font-bold text-gray-400 uppercase font-mono">${type}</span>
                              <div class="text-base font-black text-white font-mono">${formatMoney(r.amount)}</div>
                          </div>
                          <span class="px-2.5 py-1 rounded-full text-[10px] font-bold border font-mono ${statusColor}">${status}</span>
                      </div>
                      <div class="space-y-1">
                          ${detailsHTML}
                          <div class="flex justify-between text-[11px] font-mono"><span class="text-gray-400">Timestamp</span><span class="text-gray-300">${esc(formatDate(r.date || r.timestamp))}</span></div>
                      </div>
                  </div>
              `;
          }).join("");
      }

      onAuthStateChanged(auth, async user => {
          if (!user) {
              window.location.href = "login.html";
              return;
          }

          try {
              const userRef = doc(db, "Users", user.uid);
              const userSnap = await getDoc(userRef);

              if (userSnap.exists()) {
                  const data = userSnap.data();
                  const txs = Array.isArray(data.transactions) ? data.transactions : [];
                  const conversions = Array.isArray(data.conversions) ? data.conversions : [];
                  
                  allTransactions = [...txs, ...conversions];
                  allTransactions.sort((a, b) => new Date(b.date || b.timestamp || 0) - new Date(a.date || a.timestamp || 0));

                  renderTransactions(allTransactions);
              } else {
                  historyContainer.innerHTML = '<div class="text-center py-8 text-gray-400 text-xs font-mono">User data not found.</div>';
              }
          } catch (err) {
              console.error("Error loading history:", err);
              historyContainer.innerHTML = '<div class="text-center py-8 text-red-400 text-xs font-mono">Failed to load transaction history.</div>';
          }
      });
  </script>
