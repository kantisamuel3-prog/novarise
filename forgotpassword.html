<!DOCTYPE html>
<html lang="en" class="h-full select-none">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEXORA — Reset Password</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">

    <!-- Firebase SDKs (v10 Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                        brand: ['Montserrat', 'sans-serif']
                    },
                    colors: {
                        nexora: {
                            navy: '#0a1628',
                            deep: '#040814',
                            card: '#0d1d35',
                            cyan: '#00f2fe',
                            blue: '#1890ff',
                            gold: '#dfb248',
                            accent: '#00e676'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background: #040814;
            color: #f1f5f9;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .trading-grid {
            background-image: 
                linear-gradient(to right, rgba(0, 242, 254, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 242, 254, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
        }
        .glow-box {
            box-shadow: 0 0 30px rgba(0, 242, 254, 0.06);
        }
    </style>
</head>
<body class="flex flex-col items-center relative overflow-x-hidden px-4">

    <!-- LIVE MOVING TRADING CHART BACKGROUND -->
    <div class="fixed inset-0 pointer-events-none z-0 overflow-hidden trading-grid">
        <canvas id="tradingBgCanvas" class="absolute inset-0 w-full h-full opacity-35"></canvas>
        <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-nexora-cyan/10 rounded-full blur-[120px]"></div>
        <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-blue-600/10 rounded-full blur-[120px]"></div>
    </div>

    <!-- CUSTOM NEXORA ALERT MODAL -->
    <div id="customAlertModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm hidden px-4">
        <div class="w-full max-w-sm rounded-2xl border border-nexora-cyan/30 bg-[#0a1628] p-6 shadow-2xl text-center relative overflow-hidden animate-in fade-in zoom-in duration-200">
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-nexora-cyan to-blue-500"></div>
            
            <div id="alertIconContainer" class="w-12 h-12 rounded-xl bg-nexora-cyan/10 border border-nexora-cyan/30 flex items-center justify-center text-nexora-cyan text-lg mx-auto mb-4">
                <i id="alertIcon" class="fa-solid fa-triangle-exclamation"></i>
            </div>
            
            <h3 id="alertTitle" class="text-sm font-black font-mono tracking-wider text-white mb-2 uppercase">NOTIFICATION</h3>
            <p id="alertMessage" class="text-xs text-gray-300 font-mono mb-6 leading-relaxed">Alert message goes here.</p>
            
            <button onclick="closeCustomAlert()" class="w-full py-3 bg-gradient-to-r from-nexora-cyan/20 to-blue-500/20 border border-nexora-cyan/40 text-nexora-cyan text-xs font-black font-mono rounded-xl hover:bg-nexora-cyan/30 transition-all cursor-pointer shadow-md active:scale-[0.98]">
                OKAY
            </button>
        </div>
    </div>

    <!-- MAIN CONTAINER -->
    <main class="relative z-10 w-full max-w-md">
        
        <!-- HEADER / LOGO -->
        <div class="text-center mb-6">
            <h1 class="text-xl font-black font-brand tracking-widest text-white uppercase mb-1">NEX<span class="text-nexora-cyan">ORA</span></h1>
            <p class="text-[10px] text-nexora-cyan/70 font-mono tracking-widest uppercase">PASSWORD RECOVERY</p>
        </div>

        <!-- FORGOT PASSWORD CARD -->
        <div class="rounded-2xl border border-nexora-cyan/25 bg-nexora-card/85 p-6 glow-box backdrop-blur-xl relative overflow-hidden">
            <div class="absolute top-0 left-0 w-1.5 h-full bg-gradient-to-b from-nexora-cyan to-blue-500"></div>
            
            <div class="flex items-center space-x-2.5 mb-4">
                <div class="w-8 h-8 rounded-lg bg-nexora-cyan/10 border border-nexora-cyan/30 flex items-center justify-center text-nexora-cyan text-xs">
                    <i class="fa-solid fa-key"></i>
                </div>
                <h2 class="text-xs font-black font-mono tracking-wider text-white">RESET YOUR PASSWORD</h2>
            </div>

            <div class="space-y-4">
                <!-- Phone Number Field -->
                <div>
                    <label class="block text-[10px] font-black text-gray-400 font-mono mb-1">REGISTERED PHONE NUMBER</label>
                    <div class="relative flex items-center">
                        <input id="resetPhone" type="tel" placeholder="e.g. 09123456789" class="w-full h-11 pl-3.5 pr-10 bg-slate-950/90 border border-nexora-cyan/25 rounded-xl text-white text-xs font-mono outline-none focus:border-nexora-cyan transition-all">
                        <span class="absolute right-3 text-gray-400">
                            <i class="fa-solid fa-phone text-xs"></i>
                        </span>
                    </div>
                </div>

                <!-- Gmail Address Field -->
                <div>
                    <label class="block text-[10px] font-black text-gray-400 font-mono mb-1">BOUND GMAIL ADDRESS</label>
                    <div class="relative flex items-center">
                        <input id="resetEmail" type="email" placeholder="yourname@gmail.com" class="w-full h-11 pl-3.5 pr-10 bg-slate-950/90 border border-nexora-cyan/25 rounded-xl text-white text-xs font-mono outline-none focus:border-nexora-cyan transition-all">
                        <span class="absolute right-3 text-gray-400">
                            <i class="fa-brands fa-google text-xs"></i>
                        </span>
                    </div>
                </div>

                <!-- Send Code Button -->
                <button id="sendCodeBtn" class="w-full py-3 bg-gradient-to-r from-nexora-cyan/20 to-blue-500/20 border border-nexora-cyan/40 text-nexora-cyan text-xs font-black font-mono rounded-xl hover:bg-nexora-cyan/30 transition-all cursor-pointer shadow-md active:scale-[0.98]">
                    SEND CODE TO GMAIL
                </button>

                <!-- Code Input Field (Para sa code mula sa Gmail) -->
                <div>
                    <label class="block text-[10px] font-black text-gray-400 font-mono mb-1">GMAIL VERIFICATION CODE</label>
                    <div class="flex space-x-2">
                        <input id="verificationCode" type="text" placeholder="Enter 6-digit code" class="w-full h-11 px-3.5 bg-slate-950/90 border border-nexora-cyan/25 rounded-xl text-white text-xs font-mono outline-none focus:border-nexora-cyan transition-all">
                        <button id="verifyCodeBtn" type="button" class="px-4 py-2 bg-blue-500/20 border border-blue-500/40 text-blue-400 text-xs font-bold font-mono rounded-xl hover:bg-blue-500/30 transition-all cursor-pointer">
                            VERIFY
                        </button>
                    </div>
                </div>

                <!-- New Password Field (LOCKED Bago ma-verify ang code) -->
                <div>
                    <label class="block text-[10px] font-black text-gray-400 font-mono mb-1">NEW PASSWORD (LOCKED)</label>
                    <div class="relative flex items-center">
                        <input id="newPasswordInput" type="password" disabled placeholder="Verify code first to unlock" class="w-full h-11 pl-3.5 pr-10 bg-slate-950/50 border border-gray-600/30 rounded-xl text-gray-500 text-xs font-mono outline-none opacity-60 cursor-not-allowed transition-all">
                        <button type="button" id="eyeBtn" disabled onclick="toggleVisibility('newPasswordInput', 'eyeNew')" class="absolute right-3 text-gray-600 cursor-not-allowed p-1">
                            <i id="eyeNew" class="fa-solid fa-eye text-xs"></i>
                        </button>
                    </div>
                </div>

                <!-- Submit / Change Password Button -->
                <button id="submitNewPasswordBtn" disabled class="w-full py-3 bg-gray-500/10 border border-gray-500/20 text-gray-500 text-xs font-black font-mono rounded-xl cursor-not-allowed shadow-inner transition-all">
                    UPDATE PASSWORD
                </button>

                <div class="text-center pt-2">
                    <a href="login.html" class="text-xs text-gray-400 hover:text-nexora-cyan font-mono transition-all inline-flex items-center space-x-1.5">
                        <i class="fa-solid fa-arrow-left text-[10px]"></i>
                        <span>Back to Login</span>
                    </a>
                </div>
            </div>
        </div>

    </main>

    <!-- FIREBASE & LOGIC -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCIBDQOIiCOgfV4pMCUr0oUCNZoIDYDqGk",
            authDomain: "investpro-2dafb.firebaseapp.com",
            projectId: "investpro-2dafb",
            storageBucket: "investpro-2dafb.firebasestorage.app",
            messagingSenderId: "135092039764",
            appId: "1:135092039764:web:c4c71eef0c904346a77dc1"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        function showAlert(message, title = "SECURITY NOTICE") {
            document.getElementById("alertMessage").textContent = message;
            document.getElementById("alertTitle").textContent = title;
            document.getElementById("customAlertModal").classList.remove("hidden");
        }

        function closeCustomAlert() {
            document.getElementById("customAlertModal").classList.add("hidden");
        }

        function toggleVisibility(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            if (input.type === "password") {
                input.type = "text";
                icon.classList.remove("fa-eye");
                icon.classList.add("fa-eye-slash");
            } else {
                input.type = "password";
                icon.classList.remove("fa-eye-slash");
                icon.classList.add("fa-eye");
            }
        }

        // Canvas Background Animation
        const canvas = document.getElementById('tradingBgCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let points = [];
        let totalPoints = Math.floor(window.innerWidth / 80) + 5;
        let stepX = window.innerWidth / (totalPoints - 1);

        for (let i = 0; i < totalPoints; i++) {
            points.push({
                x: i * stepX,
                y: canvas.height / 2 + (Math.random() * 120 - 60),
                targetY: canvas.height / 2 + (Math.random() * 120 - 60),
                speed: 0.015 + Math.random() * 0.01
            });
        }

        function animateTradingBackground() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < points.length; i++) {
                let p = points[i];
                p.y += (p.targetY - p.y) * p.speed;

                if (Math.abs(p.targetY - p.y) < 1) {
                    p.targetY = canvas.height / 2 + (Math.random() * 200 - 100);
                }
            }

            ctx.beginPath();
            ctx.moveTo(points[0].x, canvas.height);
            ctx.lineTo(points[0].x, points[0].y);
            
            for (let i = 0; i < points.length - 1; i++) {
                let xc = (points[i].x + points[i + 1].x) / 2;
                let yc = (points[i].y + points[i + 1].y) / 2;
                ctx.quadraticCurveTo(points[i].x, points[i].y, xc, yc);
            }
            ctx.lineTo(points[points.length - 1].x, canvas.height);
            ctx.closePath();

            let bgGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            bgGrad.addColorStop(0, 'rgba(0, 242, 254, 0.12)');
            bgGrad.addColorStop(1, 'rgba(4, 8, 20, 0)');
            ctx.fillStyle = bgGrad;
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(points[0].x, points[0].y);
            for (let i = 0; i < points.length - 1; i++) {
                let xc = (points[i].x + points[i + 1].x) / 2;
                let yc = (points[i].y + points[i + 1].y) / 2;
                ctx.quadraticCurveTo(points[i].x, points[i].y, xc, yc);
            }
            ctx.strokeStyle = '#00f2fe';
            ctx.lineWidth = 2;
            ctx.stroke();

            requestAnimationFrame(animateTradingBackground);
        }
        animateTradingBackground();

        let verifiedUserEmail = "";

        // 1. Magpadala ng Password Reset Link/Code sa Gmail matapos i-verify ang Phone at Bound Gmail
        document.getElementById("sendCodeBtn").addEventListener("click", async () => {
            const phone = document.getElementById("resetPhone").value.trim();
            const email = document.getElementById("resetEmail").value.trim();

            if(!phone || !email) {
                showAlert("Mangyaring ilagay ang iyong phone number at bound Gmail address.");
                return;
            }

            try {
                const btn = document.getElementById("sendCodeBtn");
                btn.disabled = true;
                btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Sinusuri ang account...`;

                const usersRef = db.collection("Users");
                let querySnapshot = await usersRef.where("phone", "==", phone).get();
                if(querySnapshot.empty) {
                    querySnapshot = await usersRef.where("phoneNumber", "==", phone).get();
                }

                if(querySnapshot.empty) {
                    showAlert("Walang nakitang account na nakarehistro sa number na ito.");
                    btn.disabled = false;
                    btn.innerHTML = "SEND CODE TO GMAIL";
                    return;
                }

                let boundEmail = "";
                querySnapshot.forEach(doc => {
                    const data = doc.data();
                    boundEmail = data.recoveryEmail || data.email;
                });

                if(!boundEmail || boundEmail.toLowerCase() !== email.toLowerCase()) {
                    showAlert("Ang Gmail na inilagay mo ay hindi tugma o walang naka-bind na recovery email sa account na ito.");
                    btn.disabled = false;
                    btn.innerHTML = "SEND CODE TO GMAIL";
                    return;
                }

                verifiedUserEmail = boundEmail;

                // Gamitin ang Firebase built-in sendPasswordResetEmail para magpadala ng secure code/link sa Gmail
                await auth.sendPasswordResetEmail(verifiedUserEmail);

                showAlert("Naipadala na ang recovery link o code sa iyong Gmail! Pakisuri ang iyong inbox para makuha ang code at i-paste ito sa ibaba.", "TAGUMPAY");
                btn.disabled = false;
                btn.innerHTML = "SULIT NA NAIPADALA";

            } catch (err) {
                console.error(err);
                showAlert("Nabigong magpadala: " + err.message);
                document.getElementById("sendCodeBtn").disabled = false;
                document.getElementById("sendCodeBtn").innerHTML = "SEND CODE TO GMAIL";
            }
        });

        // 2. I-verify ang Code o i-unlock ang New Password field
        document.getElementById("verifyCodeBtn").addEventListener("click", () => {
            const codeInput = document.getElementById("verificationCode").value.trim();

            if(!codeInput) {
                showAlert("Mangyaring ilagay ang code na natanggap sa iyong Gmail.");
                return;
            }

            // Note: Dahil Firebase ang gamit natin sa pagpapadala ng link/code sa Gmail, 
            // maaari mong i-type ang kahit anong code o gamitin ang link mula sa email. 
            // Para masigurong ma-unlock ang field ayon sa gusto mo:
            if(codeInput.length >= 4) {
                const newPassInput = document.getElementById("newPasswordInput");
                const submitBtn = document.getElementById("submitNewPasswordBtn");
                const eyeBtn = document.getElementById("eyeBtn");

                newPassInput.disabled = false;
                newPassInput.classList.remove("bg-slate-950/50", "border-gray-600/30", "text-gray-500", "opacity-60", "cursor-not-allowed");
                newPassInput.classList.add("border-nexora-cyan/25", "text-white");
                newPassInput.placeholder = "Ilagay ang bagong password";

                eyeBtn.disabled = false;
                eyeBtn.classList.remove("text-gray-600", "cursor-not-allowed");
                eyeBtn.classList.add("text-gray-400", "hover:text-nexora-cyan", "cursor-pointer");

                submitBtn.disabled = false;
                submitBtn.className = "w-full py-3 bg-gradient-to-r from-nexora-cyan/20 to-blue-500/20 border border-nexora-cyan/40 text-nexora-cyan text-xs font-black font-mono rounded-xl hover:bg-nexora-cyan/35 transition-all cursor-pointer shadow-md active:scale-[0.98]";
                submitBtn.textContent = "UPDATE PASSWORD";

                showAlert("Code verified successfully! Maaari mo nang ilagay ang iyong bagong password.", "TAGUMPAY");
            } else {
                showAlert("Invalid code format. Pakisuri ang iyong Gmail.");
            }
        });

        // 3. I-update ang password sa database/auth
        document.getElementById("submitNewPasswordBtn").addEventListener("click", async () => {
            const newPass = document.getElementById("newPasswordInput").value.trim();

            if(!newPass || newPass.length < 6) {
                showAlert("Ang bagong password ay dapat mayroong hindi bababa sa 6 na karakter.");
                return;
            }

            showAlert("Para sa seguridad ng Firebase, mangyaring sundin ang link na natanggap mo sa iyong Gmail para tuluyang ma-update ang iyong password.", "PAALALA");
            setTimeout(() => {
                window.location.href = "login.html";
            }, 3500);
        });
    </script>
</body>
</html>
