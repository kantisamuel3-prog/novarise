    <!-- FIREBASE & LOGIC -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCIBDQOIiCOgfV4pMCUr0oUCNZoIDYDqGk",
            authDomain: "investpro-2dafb.firebaseapp.com",
            projectId: "investpro-2dafb",
            storageBucket: "investpro-2dafb.firebasestorage.app",
            messagingSenderId: "135092039764",
            appId: "1:135092039764:web:c4c71eef0c904346a77dc1"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let selectedBankMethod = "GCash";

        // Bank Selection Logic with GCash Blue & Maya Green Styling
        document.getElementById("methodGcash").addEventListener("click", () => {
            if(document.getElementById("saveBankBtn").disabled) return;
            selectedBankMethod = "GCash";
            document.getElementById("methodGcash").className = "h-12 px-3 rounded-xl border border-blue-500/40 bg-[#007dfc] text-white transition-all cursor-pointer shadow-md flex items-center justify-center space-x-2";
            document.getElementById("methodMaya").className = "h-12 px-3 rounded-xl border border-emerald-500/20 bg-slate-950/90 text-gray-400 transition-all cursor-pointer flex items-center justify-center space-x-1.5 opacity-60";
            document.getElementById("bankNumberLabel").textContent = "GCASH NUMBER";
        });

        document.getElementById("methodMaya").addEventListener("click", () => {
            if(document.getElementById("saveBankBtn").disabled) return;
            selectedBankMethod = "Maya";
            document.getElementById("methodMaya").className = "h-12 px-3 rounded-xl border border-emerald-500/40 bg-black text-[#50e3a4] transition-all cursor-pointer shadow-md flex items-center justify-center space-x-1.5 opacity-100";
            document.getElementById("methodGcash").className = "h-12 px-3 rounded-xl border border-blue-500/20 bg-slate-950/90 text-gray-400 transition-all cursor-pointer flex items-center justify-center space-x-2 opacity-60";
            document.getElementById("bankNumberLabel").textContent = "MAYA NUMBER";
        });

        // Navigation Functions between Menu and Forms
        function openSection(sectionId) {
            document.getElementById("settingsMenu").classList.add("hidden");
            document.getElementById("settingsFormsContainer").classList.remove("hidden");
            
            document.querySelectorAll(".form-panel").forEach(panel => {
                panel.classList.add("hidden");
            });
            document.getElementById(sectionId).classList.remove("hidden");
        }

        function backToMenu() {
            document.getElementById("settingsFormsContainer").classList.add("hidden");
            document.getElementById("settingsMenu").classList.remove("hidden");
        }

        // Custom Alert Function
        function showAlert(message, title = "SECURITY NOTICE") {
            document.getElementById("alertMessage").textContent = message;
            document.getElementById("alertTitle").textContent = title;
            document.getElementById("customAlertModal").classList.remove("hidden");
        }

        function closeCustomAlert() {
            document.getElementById("customAlertModal").classList.add("hidden");
        }

        // Canvas Background Animation
        const canvas = document.getElementById('tradingBgCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let points = [];
        let totalPoints = Math.floor(window.innerWidth / 80) + 5;
        let stepX = window.innerWidth / (totalPoints - 1);

        for (let i = 0; i < totalPoints; i++) {
            points.push({
                x: i * stepX,
                y: canvas.height / 2 + (Math.random() * 120 - 60),
                targetY: canvas.height / 2 + (Math.random() * 120 - 60),
                speed: 0.015 + Math.random() * 0.01
            });
        }

        function animateTradingBackground() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < points.length; i++) {
                let p = points[i];
                p.y += (p.targetY - p.y) * p.speed;

                if (Math.abs(p.targetY - p.y) < 1) {
                    p.targetY = canvas.height / 2 + (Math.random() * 200 - 100);
                }
            }

            ctx.beginPath();
            ctx.moveTo(points[0].x, canvas.height);
            ctx.lineTo(points[0].x, points[0].y);
            
            for (let i = 0; i < points.length - 1; i++) {
                let xc = (points[i].x + points[i + 1].x) / 2;
                let yc = (points[i].y + points[i + 1].y) / 2;
                ctx.quadraticCurveTo(points[i].x, points[i].y, xc, yc);
            }
            ctx.lineTo(points[points.length - 1].x, canvas.height);
            ctx.closePath();

            let bgGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            bgGrad.addColorStop(0, 'rgba(0, 242, 254, 0.12)');
            bgGrad.addColorStop(1, 'rgba(4, 8, 20, 0)');
            ctx.fillStyle = bgGrad;
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(points[0].x, points[0].y);
            for (let i = 0; i < points.length - 1; i++) {
                let xc = (points[i].x + points[i + 1].x) / 2;
                let yc = (points[i].y + points[i + 1].y) / 2;
                ctx.quadraticCurveTo(points[i].x, points[i].y, xc, yc);
            }
            ctx.strokeStyle = '#00f2fe';
            ctx.lineWidth = 2;
            ctx.stroke();

            requestAnimationFrame(animateTradingBackground);
        }
        animateTradingBackground();

        function toggleVisibility(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            if (input.type === "password") {
                input.type = "text";
                icon.classList.remove("fa-eye");
                icon.classList.add("fa-eye-slash");
            } else {
                input.type = "password";
                icon.classList.remove("fa-eye-slash");
                icon.classList.add("fa-eye");
            }
        }

        document.getElementById("backBtn").addEventListener("click", () => {
            window.location.href = "account.html";
        });

        auth.onAuthStateChanged(async (user) => {
            if(!user){
                window.location.href = "login.html";
                return;
            }

            try {
                const userRef = db.collection("Users").doc(user.uid);
                const userDoc = await userRef.get();
                if(userDoc.exists){
                    const data = userDoc.data();
                    
                    if(data.recoveryEmail) {
                        const emailInput = document.getElementById("bindEmailInput");
                        const saveBtn = document.getElementById("saveGmailBtn");
                        const badge = document.getElementById("bindStatusBadge");
                        
                        emailInput.value = data.recoveryEmail;
                        emailInput.disabled = true;
                        emailInput.classList.add("opacity-60", "cursor-not-allowed");

                        saveBtn.disabled = true;
                        saveBtn.textContent = "LOCKED / BOUND";
                        saveBtn.className = "w-full py-3 bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-xs font-black font-mono rounded-xl cursor-not-allowed shadow-inner";

                        badge.textContent = "LOCKED";
                        badge.className = "text-[9px] font-mono font-bold px-2 py-0.5 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/30";
                    }

                    // Check Bank Account Binding (GCash / Maya)
                    if(data.bankAccount && data.bankAccount.number) {
                        const bankNameInput = document.getElementById("bankAccountName");
                        const bankNumberInput = document.getElementById("bankAccountNumber");
                        const saveBankBtn = document.getElementById("saveBankBtn");
                        const bankBadge = document.getElementById("bankStatusBadge");

                        bankNameInput.value = data.bankAccount.name || "";
                        bankNumberInput.value = data.bankAccount.number || "";
                        
                        if(data.bankAccount.method === "Maya") {
                            selectedBankMethod = "Maya";
                            document.getElementById("methodMaya").className = "h-12 px-3 rounded-xl border border-emerald-500/40 bg-black text-[#50e3a4] transition-all cursor-pointer shadow-md flex items-center justify-center space-x-1.5 opacity-100";
                            document.getElementById("methodGcash").className = "h-12 px-3 rounded-xl border border-blue-500/20 bg-slate-950/90 text-gray-400 transition-all cursor-pointer flex items-center justify-center space-x-2 opacity-60";
                            document.getElementById("bankNumberLabel").textContent = "MAYA NUMBER";
                        } else {
                            selectedBankMethod = "GCash";
                            document.getElementById("methodGcash").className = "h-12 px-3 rounded-xl border border-blue-500/40 bg-[#007dfc] text-white transition-all cursor-pointer shadow-md flex items-center justify-center space-x-2";
                            document.getElementById("methodMaya").className = "h-12 px-3 rounded-xl border border-emerald-500/20 bg-slate-950/90 text-gray-400 transition-all cursor-pointer flex items-center justify-center space-x-1.5 opacity-60";
                            document.getElementById("bankNumberLabel").textContent = "GCASH NUMBER";
                        }

                        bankNameInput.disabled = true;
                        bankNameInput.classList.add("opacity-60", "cursor-not-allowed");
                        bankNumberInput.disabled = true;
                        bankNumberInput.classList.add("opacity-60", "cursor-not-allowed");
                        document.getElementById("methodGcash").style.pointerEvents = "none";
                        document.getElementById("methodMaya").style.pointerEvents = "none";

                        saveBankBtn.disabled = true;
                        saveBankBtn.textContent = `LOCKED / BOUND (${selectedBankMethod})`;
                        saveBankBtn.className = "w-full py-3 bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-xs font-black font-mono rounded-xl cursor-not-allowed shadow-inner";

                        bankBadge.textContent = "LOCKED";
                        bankBadge.className = "text-[9px] font-mono font-bold px-2 py-0.5 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/30";
                    }

                    if(data.withdrawalPin){
                        document.getElementById("currentPinWrapper").style.display = "block";
                        document.getElementById("pinCardTitle").textContent = "CHANGE WITHDRAWAL PIN";
                        document.getElementById("menuPinTitle").textContent = "CHANGE WITHDRAWAL PIN";
                        document.getElementById("newPinLabelText").textContent = "NEW 4-DIGIT PIN";
                        document.getElementById("savePinBtn").textContent = "Update Withdrawal PIN";
                    } else {
                        document.getElementById("currentPinWrapper").style.display = "none";
                        document.getElementById("pinCardTitle").textContent = "WITHDRAWAL PIN";
                        document.getElementById("menuPinTitle").textContent = "WITHDRAWAL PIN";
                        document.getElementById("newPinLabelText").textContent = "ENTER 4-DIGIT PIN";
                        document.getElementById("savePinBtn").textContent = "Create Withdrawal PIN";
                    }
                }
            } catch(e) {
                console.error("Error loading user status:", e);
            }
        });

        // Save Gmail Logic
        document.getElementById("saveGmailBtn").addEventListener("click", async () => {
            const emailInput = document.getElementById("bindEmailInput");
            const email = emailInput.value.trim();
            if(!email || !email.includes("@") || !email.endsWith("@gmail.com")) {
                showAlert("Please enter a valid Gmail address ending with @gmail.com.");
                return;
            }

            try {
                const user = auth.currentUser;
                if(!user) return;

                await db.collection("Users").doc(user.uid).set({
                    recoveryEmail: email
                }, { merge: true });

                emailInput.disabled = true;
                emailInput.classList.add("opacity-60", "cursor-not-allowed");

                const saveBtn = document.getElementById("saveGmailBtn");
                saveBtn.disabled = true;
                saveBtn.textContent = "LOCKED / BOUND";
                saveBtn.className = "w-full py-3 bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-xs font-black font-mono rounded-xl cursor-not-allowed shadow-inner";

                const badge = document.getElementById("bindStatusBadge");
                badge.textContent = "LOCKED";
                badge.className = "text-[9px] font-mono font-bold px-2 py-0.5 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/30";

                showAlert("Your Gmail address has been successfully bound and permanently locked!", "SUCCESS");
            } catch(err) {
                console.error(err);
                showAlert("Failed to bind Gmail: " + err.message);
            }
        });

        // Save Bank Account Logic (GCash / Maya)
        document.getElementById("saveBankBtn").addEventListener("click", async () => {
            const nameInput = document.getElementById("bankAccountName");
            const numberInput = document.getElementById("bankAccountNumber");
            const name = nameInput.value.trim();
            const number = numberInput.value.trim();

            if(!name) {
                showAlert("Please enter the account holder name.");
                return;
            }
            if(!number || number.length < 10) {
                showAlert("Please enter a valid mobile number.");
                return;
            }

            try {
                const user = auth.currentUser;
                if(!user) return;

                const bankData = {
                    method: selectedBankMethod,
                    name: name,
                    number: number
                };

                await db.collection("Users").doc(user.uid).set({
                    bankAccount: bankData
                }, { merge: true });

                nameInput.disabled = true;
                nameInput.classList.add("opacity-60", "cursor-not-allowed");
                numberInput.disabled = true;
                numberInput.classList.add("opacity-60", "cursor-not-allowed");
                document.getElementById("methodGcash").style.pointerEvents = "none";
                document.getElementById("methodMaya").style.pointerEvents = "none";

                const saveBtn = document.getElementById("saveBankBtn");
                saveBtn.disabled = true;
                saveBtn.textContent = `LOCKED / BOUND (${selectedBankMethod})`;
                saveBtn.className = "w-full py-3 bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-xs font-black font-mono rounded-xl cursor-not-allowed shadow-inner";

                const badge = document.getElementById("bankStatusBadge");
                badge.textContent = "LOCKED";
                badge.className = "text-[9px] font-mono font-bold px-2 py-0.5 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/30";

                showAlert(`Your ${selectedBankMethod} account has been successfully bound and locked!`, "SUCCESS");
            } catch(err) {
                console.error(err);
                showAlert("Failed to bind bank account: " + err.message);
            }
        });

        document.getElementById("updatePasswordBtn").addEventListener("click", async () => {
            const currentPass = document.getElementById("currentPassword").value.trim();
            const newPass = document.getElementById("newPassword").value.trim();

            if(!currentPass) {
                showAlert("Please enter your current password.");
                return;
            }
            if(newPass.length < 6) {
                showAlert("The new password must be at least 6 characters long.");
                return;
            }

            try {
                const user = auth.currentUser;
                if(!user || !user.email) return;

                const credential = firebase.auth.EmailAuthProvider.credential(user.email, currentPass);
                await user.reauthenticateWithCredential(credential);
                await user.updatePassword(newPass);

                showAlert("Your password has been successfully updated!", "SUCCESS");
                document.getElementById("currentPassword").value = "";
                document.getElementById("newPassword").value = "";
            } catch(err) {
                console.error(err);
                if(err.code === 'auth/wrong-password' || err.code === 'auth/invalid-credential') {
                    showAlert("The current password you entered is incorrect.");
                } else {
                    showAlert("Failed to update password: " + err.message);
                }
            }
        });

        document.getElementById("savePinBtn").addEventListener("click", async () => {
            const newPin = document.getElementById("withdrawalPinInput").value.trim();
            
            if(!/^\d{4}$/.test(newPin)) {
                showAlert("The Withdrawal PIN must be exactly 4 digits.");
                return;
            }

            try {
                const user = auth.currentUser;
                if(!user) return;

                const userRef = db.collection("Users").doc(user.uid);
                const userDoc = await userRef.get();

                if(userDoc.exists && userDoc.data().withdrawalPin) {
                    const currentPinInput = document.getElementById("currentPinInput").value.trim();
                    if(!currentPinInput) {
                        showAlert("Please enter your current Withdrawal PIN.");
                        return;
                    }
                    if(currentPinInput !== userDoc.data().withdrawalPin) {
                        showAlert("The current Withdrawal PIN you entered is incorrect.");
                        return;
                    }
                }

                await userRef.update({
                    withdrawalPin: newPin
                });

                showAlert("Your 4-digit Withdrawal PIN has been successfully saved/updated!", "SUCCESS");
                
                document.getElementById("currentPinWrapper").style.display = "block";
                document.getElementById("pinCardTitle").textContent = "CHANGE WITHDRAWAL PIN";
                document.getElementById("menuPinTitle").textContent = "CHANGE WITHDRAWAL PIN";
                document.getElementById("newPinLabelText").textContent = "NEW 4-DIGIT PIN";
                document.getElementById("savePinBtn").textContent = "Update Withdrawal PIN";
                document.getElementById("currentPinInput").value = "";
                document.getElementById("withdrawalPinInput").value = "";
            } catch(err) {
                console.error(err);
                showAlert("Failed to save PIN.");
            }
        });
    </script>
</body>
</html>
