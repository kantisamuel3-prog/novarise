<!DOCTYPE html>
<html lang="en" class="h-full select-none">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXORA — Account Settings</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">

    <!-- Firebase SDKs (v10 Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                        brand: ['Montserrat', 'sans-serif']
                    },
                    colors: {
                        nexora: {
                            navy: '#0a1628',
                            deep: '#040814',
                            card: '#0d1d35',
                            cyan: '#00f2fe',
                            blue: '#1890ff',
                            gold: '#dfb248',
                            accent: '#00e676'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background: #040814;
            color: #f1f5f9;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
        }
        .trading-grid {
            background-image: 
                linear-gradient(to right, rgba(0, 242, 254, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 242, 254, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
        }
        .glow-box {
            box-shadow: 0 0 30px rgba(0, 242, 254, 0.06);
        }
    </style>
</head>
<body class="flex flex-col min-h-screen relative overflow-x-hidden">

    <!-- LIVE TRADING BACKGROUND -->
    <div class="fixed inset-0 pointer-events-none z-0 overflow-hidden trading-grid">
        <canvas id="tradingBgCanvas" class="absolute inset-0 w-full h-full opacity-30"></canvas>
        <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-nexora-cyan/10 rounded-full blur-[120px]"></div>
        <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-blue-600/10 rounded-full blur-[120px]"></div>
    </div>

    <!-- CUSTOM NEXORA ALERT MODAL -->
    <div id="customAlertModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm hidden px-4">
        <div class="w-full max-w-sm rounded-2xl border border-nexora-cyan/30 bg-[#0a1628] p-6 shadow-2xl text-center relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-nexora-cyan to-blue-500"></div>
            
            <div id="alertIconContainer" class="w-12 h-12 rounded-xl bg-nexora-cyan/10 border border-nexora-cyan/30 flex items-center justify-center text-nexora-cyan text-lg mx-auto mb-4">
                <i id="alertIcon" class="fa-solid fa-circle-info"></i>
            </div>
            
            <h3 id="alertTitle" class="text-sm font-black font-mono tracking-wider text-white mb-2 uppercase">NOTIFICATION</h3>
            <p id="alertMessage" class="text-xs text-gray-300 font-mono mb-6 leading-relaxed">Alert message goes here.</p>
            
            <button onclick="closeCustomAlert()" class="w-full py-3 bg-gradient-to-r from-nexora-cyan/20 to-blue-500/20 border border-nexora-cyan/40 text-nexora-cyan text-xs font-black font-mono rounded-xl hover:bg-nexora-cyan/30 transition-all cursor-pointer shadow-md active:scale-[0.98]">
                OKAY
            </button>
        </div>
    </div>

    <!-- HEADER -->
    <header class="relative z-20 w-full bg-[#030914]/90 backdrop-blur-md border-b border-nexora-cyan/20 px-4 py-3 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <a href="dashboard.html" class="w-8 h-8 rounded-lg bg-nexora-cyan/10 border border-nexora-cyan/30 flex items-center justify-center text-nexora-cyan hover:bg-nexora-cyan/20 transition-all">
                <i class="fa-solid fa-arrow-left text-xs"></i>
            </a>
            <h1 class="text-sm font-black font-brand tracking-widest text-white uppercase">ACCOUNT <span class="text-nexora-cyan">SETTINGS</span></h1>
        </div>
        <div class="text-[10px] font-mono text-nexora-cyan bg-nexora-cyan/10 border border-nexora-cyan/30 px-2.5 py-1 rounded-lg">
            SECURE TERMINAL
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="relative z-10 w-full max-w-xl mx-auto p-4 space-y-6 my-auto">

        <!-- BIND GMAIL FOR ACCOUNT RECOVERY SECTION -->
        <div class="rounded-2xl border border-nexora-cyan/25 bg-nexora-card/85 p-6 glow-box backdrop-blur-xl relative overflow-hidden">
            <div class="absolute top-0 left-0 w-1.5 h-full bg-gradient-to-b from-nexora-cyan to-blue-500"></div>
            
            <div class="flex items-center space-x-2.5 mb-4">
                <div class="w-8 h-8 rounded-lg bg-nexora-cyan/10 border border-nexora-cyan/30 flex items-center justify-center text-nexora-cyan text-xs">
                    <i class="fa-solid fa-envelope-circle-check"></i>
                </div>
                <h2 class="text-xs font-black font-mono tracking-wider text-white">BIND GMAIL FOR RECOVERY</h2>
            </div>

            <p class="text-xs text-gray-400 font-mono mb-4 leading-relaxed">
                Link your personal Gmail address to receive security alerts and instant password recovery verification codes.
            </p>

            <div class="space-y-4">
                <div>
                    <label class="block text-[10px] font-black text-gray-400 font-mono mb-1">GMAIL ADDRESS</label>
                    <div class="relative flex items-center">
                        <input id="bindEmailInput" type="email" placeholder="yourname@gmail.com" class="w-full h-11 pl-3.5 pr-10 bg-slate-950/90 border border-nexora-cyan/25 rounded-xl text-white text-xs font-mono outline-none focus:border-nexora-cyan transition-all">
                        <span class="absolute right-3 text-gray-400">
                            <i class="fa-brands fa-google text-xs"></i>
                        </span>
                    </div>
                </div>

                <div class="flex space-x-3">
                    <button id="saveGmailBtn" class="flex-1 py-3 bg-gradient-to-r from-nexora-cyan/20 to-blue-500/20 border border-nexora-cyan/40 text-nexora-cyan text-xs font-black font-mono rounded-xl hover:bg-nexora-cyan/30 transition-all cursor-pointer shadow-md active:scale-[0.98]">
                        SAVE GMAIL
                    </button>
                    <button id="sendRecoveryCodeBtn" class="flex-1 py-3 bg-gradient-to-r from-emerald-500/20 to-blue-500/20 border border-emerald-500/40 text-emerald-400 text-xs font-black font-mono rounded-xl hover:bg-emerald-500/30 transition-all cursor-pointer shadow-md active:scale-[0.98]">
                        SEND RECOVERY CODE
                    </button>
                </div>
            </div>
        </div>

        <!-- WITHDRAWAL PIN MANAGEMENT SECTION -->
        <div class="rounded-2xl border border-nexora-cyan/25 bg-nexora-card/85 p-6 glow-box backdrop-blur-xl relative overflow-hidden">
            <div class="absolute top-0 left-0 w-1.5 h-full bg-gradient-to-b from-nexora-cyan to-blue-500"></div>
            
            <div class="flex items-center space-x-2.5 mb-4">
                <div class="w-8 h-8 rounded-lg bg-nexora-cyan/10 border border-nexora-cyan/30 flex items-center justify-center text-nexora-cyan text-xs">
                    <i class="fa-solid fa-shield-keyhole"></i>
                </div>
                <h2 id="pinSectionTitle" class="text-xs font-black font-mono tracking-wider text-white">WITHDRAWAL PIN MANAGEMENT</h2>
            </div>

            <div id="pinFormContainer" class="space-y-4">
                <!-- Dynamically adjusted via JS depending on whether user has an existing PIN -->
            </div>
        </div>

    </main>

    <!-- FIREBASE & LOGIC -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCIBDQOIiCOgfV4pMCUr0oUCNZoIDYDqGk",
            authDomain: "investpro-2dafb.firebaseapp.com",
            projectId: "investpro-2dafb",
            storageBucket: "investpro-2dafb.firebasestorage.app",
            messagingSenderId: "135092039764",
            appId: "1:135092039764:web:c4c71eef0c904346a77dc1"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // Custom Alert Function
        function showAlert(message, title = "SECURITY NOTICE") {
            document.getElementById("alertMessage").textContent = message;
            document.getElementById("alertTitle").textContent = title;
            document.getElementById("customAlertModal").classList.remove("hidden");
        }

        function closeCustomAlert() {
            document.getElementById("customAlertModal").classList.add("hidden");
        }

        // Canvas Background Animation
        const canvas = document.getElementById('tradingBgCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let points = [];
        let totalPoints = Math.floor(window.innerWidth / 80) + 5;
        let stepX = window.innerWidth / (totalPoints - 1);

        for (let i = 0; i < totalPoints; i++) {
            points.push({
                x: i * stepX,
                y: canvas.height / 2 + (Math.random() * 120 - 60),
                targetY: canvas.height / 2 + (Math.random() * 120 - 60),
                speed: 0.015 + Math.random() * 0.01
            });
        }

        function animateTradingBackground() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < points.length; i++) {
                let p = points[i];
                p.y += (p.targetY - p.y) * p.speed;

                if (Math.abs(p.targetY - p.y) < 1) {
                    p.targetY = canvas.height / 2 + (Math.random() * 200 - 100);
                }
            }

            ctx.beginPath();
            ctx.moveTo(points[0].x, canvas.height);
            ctx.lineTo(points[0].x, points[0].y);
            
            for (let i = 0; i < points.length - 1; i++) {
                let xc = (points[i].x + points[i + 1].x) / 2;
                let yc = (points[i].y + points[i + 1].y) / 2;
                ctx.quadraticCurveTo(points[i].x, points[i].y, xc, yc);
            }
            ctx.lineTo(points[points.length - 1].x, canvas.height);
            ctx.closePath();

            let bgGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            bgGrad.addColorStop(0, 'rgba(0, 242, 254, 0.12)');
            bgGrad.addColorStop(1, 'rgba(4, 8, 20, 0)');
            ctx.fillStyle = bgGrad;
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(points[0].x, points[0].y);
            for (let i = 0; i < points.length - 1; i++) {
                let xc = (points[i].x + points[i + 1].x) / 2;
                let yc = (points[i].y + points[i + 1].y) / 2;
                ctx.quadraticCurveTo(points[i].x, points[i].y, xc, yc);
            }
            ctx.strokeStyle = '#00f2fe';
            ctx.lineWidth = 2;
            ctx.stroke();

            requestAnimationFrame(animateTradingBackground);
        }
        animateTradingBackground();

        // Check Auth and Load User Data
        auth.onAuthStateChanged(async (user) => {
            if (!user) {
                window.location.href = "login.html";
                return;
            }

            const userRef = db.collection("users").doc(user.uid);
            const doc = await userRef.get();

            if (doc.exists) {
                const data = doc.data();
                if (data.recoveryEmail) {
                    document.getElementById("bindEmailInput").value = data.recoveryEmail;
                }

                // Setup Withdrawal PIN UI (Creation vs Update)
                const pinContainer = document.getElementById("pinFormContainer");
                if (!data.withdrawalPin) {
                    pinContainer.innerHTML = `
                        <p class="text-xs text-gray-400 font-mono mb-3">You have not created a withdrawal PIN yet. Set your 6-digit PIN below.</p>
                        <div>
                            <label class="block text-[10px] font-black text-gray-400 font-mono mb-1">NEW 6-DIGIT PIN</label>
                            <input id="newPin" type="password" maxlength="6" placeholder="******" class="w-full h-11 px-3.5 bg-slate-950/90 border border-nexora-cyan/25 rounded-xl text-white text-xs font-mono outline-none focus:border-nexora-cyan mb-3">
                        </div>
                        <button id="savePinBtn" class="w-full py-3 bg-gradient-to-r from-nexora-cyan/20 to-blue-500/20 border border-nexora-cyan/40 text-nexora-cyan text-xs font-black font-mono rounded-xl hover:bg-nexora-cyan/30 transition-all cursor-pointer shadow-md">
                            CREATE WITHDRAWAL PIN
                        </button>
                    `;
                    document.getElementById("savePinBtn").addEventListener("click", async () => {
                        const pin = document.getElementById("newPin").value.trim();
                        if (pin.length !== 6 || isNaN(pin)) {
                            showAlert("Withdrawal PIN must be exactly 6 digits.");
                            return;
                        }
                        await userRef.update({ withdrawalPin: pin });
                        showAlert("Withdrawal PIN created successfully!", "SUCCESS");
                        setTimeout(() => location.reload(), 1500);
                    });
                } else {
                    pinContainer.innerHTML = `
                        <p class="text-xs text-gray-400 font-mono mb-3">Update your current withdrawal PIN by entering your current and new PIN.</p>
                        <div class="space-y-3">
                            <div>
                                <label class="block text-[10px] font-black text-gray-400 font-mono mb-1">CURRENT PIN</label>
                                <input id="currentPin" type="password" maxlength="6" placeholder="******" class="w-full h-11 px-3.5 bg-slate-950/90 border border-nexora-cyan/25 rounded-xl text-white text-xs font-mono outline-none focus:border-nexora-cyan">
                            </div>
                            <div>
                                <label class="block text-[10px] font-black text-gray-400 font-mono mb-1">NEW PIN</label>
                                <input id="updateNewPin" type="password" maxlength="6" placeholder="******" class="w-full h-11 px-3.5 bg-slate-950/90 border border-nexora-cyan/25 rounded-xl text-white text-xs font-mono outline-none focus:border-nexora-cyan">
                            </div>
                        </div>
                        <button id="updatePinBtn" class="w-full mt-4 py-3 bg-gradient-to-r from-nexora-cyan/20 to-blue-500/20 border border-nexora-cyan/40 text-nexora-cyan text-xs font-black font-mono rounded-xl hover:bg-nexora-cyan/30 transition-all cursor-pointer shadow-md">
                            UPDATE WITHDRAWAL PIN
                        </button>
                    `;
                    document.getElementById("updatePinBtn").addEventListener("click", async () => {
                        const curr = document.getElementById("currentPin").value.trim();
                        const next = document.getElementById("updateNewPin").value.trim();
                        if (curr !== data.withdrawalPin) {
                            showAlert("Current withdrawal PIN is incorrect.");
                            return;
                        }
                        if (next.length !== 6 || isNaN(next)) {
                            showAlert("New withdrawal PIN must be exactly 6 digits.");
                            return;
                        }
                        await userRef.update({ withdrawalPin: next });
                        showAlert("Withdrawal PIN updated successfully!", "SUCCESS");
                        setTimeout(() => location.reload(), 1500);
                    });
                }
            }
        });

        // Save Gmail Logic
        document.getElementById("saveGmailBtn").addEventListener("click", async () => {
            const email = document.getElementById("bindEmailInput").value.trim();
            if (!email || !email.includes("@") || !email.endsWith("@gmail.com")) {
                showAlert("Please enter a valid Gmail address ending with @gmail.com.");
                return;
            }

            const user = auth.currentUser;
            if (user) {
                try {
                    await db.collection("users").doc(user.uid).update({ recoveryEmail: email });
                    showAlert("Gmail address successfully bound to your account!", "SUCCESS");
                } catch (err) {
                    console.error(err);
                    showAlert("Failed to bind Gmail: " + err.message);
                }
            }
        });

        // Send Recovery Code Logic
        document.getElementById("sendRecoveryCodeBtn").addEventListener("click", async () => {
            const email = document.getElementById("bindEmailInput").value.trim();
            if (!email) {
                showAlert("Please save or enter a Gmail address first.");
                return;
            }

            try {
                // Trigger Firebase password reset email as the recovery verification flow
                await auth.sendPasswordResetEmail(email);
                showAlert("A secure recovery code/link has been sent to your bound Gmail address.", "SUCCESS");
            } catch (err) {
                console.error(err);
                showAlert("Failed to send recovery code: " + err.message);
            }
        });
    </script>
</body>
</html>
