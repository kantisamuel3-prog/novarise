<!DOCTYPE html>
<html lang="en" class="h-full select-none">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEXORA — Security Settings</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">

    <!-- Firebase SDKs (v10 Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                        brand: ['Montserrat', 'sans-serif']
                    },
                    colors: {
                        nexora: {
                            navy: '#0a1628',
                            deep: '#040814',
                            card: '#0d1d35',
                            cyan: '#00f2fe',
                            blue: '#1890ff',
                            gold: '#dfb248',
                            accent: '#00e676'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background: #040814;
            color: #f1f5f9;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            padding-bottom: 50px;
        }
        .trading-grid {
            background-image: 
                linear-gradient(to right, rgba(0, 242, 254, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 242, 254, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
        }
        .glow-box {
            box-shadow: 0 0 30px rgba(0, 242, 254, 0.06);
        }
    </style>
</head>
<body class="flex flex-col items-center relative overflow-x-hidden">

    <!-- LIVE MOVING TRADING CHART BACKGROUND -->
    <div class="fixed inset-0 pointer-events-none z-0 overflow-hidden trading-grid">
        <canvas id="tradingBgCanvas" class="absolute inset-0 w-full h-full opacity-35"></canvas>
        <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-nexora-cyan/10 rounded-full blur-[120px]"></div>
        <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-blue-600/10 rounded-full blur-[120px]"></div>
    </div>

    <!-- MAIN CONTAINER -->
    <main class="relative z-10 w-full max-w-md px-4 py-6">
        
        <!-- HEADER -->
        <div class="flex items-center justify-between mb-6">
            <button id="backBtn" class="w-11 h-11 border border-nexora-cyan/30 rounded-xl bg-nexora-card/90 text-nexora-cyan flex items-center justify-center cursor-pointer hover:bg-nexora-cyan/20 transition-all shadow-lg active:scale-95">
                <i class="fa-solid fa-arrow-left text-sm"></i>
            </button>
            <div class="text-center">
                <h1 class="text-sm font-black tracking-widest text-white font-mono uppercase">SECURITY SETTINGS</h1>
                <p class="text-[10px] text-nexora-cyan/70 font-mono tracking-wider">PROTECT YOUR ACCOUNT</p>
            </div>
            <div class="w-11"></div>
        </div>

        <!-- SETTINGS WRAPPER -->
        <div class="space-y-4">

            <!-- CHANGE PASSWORD CARD -->
            <div class="rounded-2xl border border-nexora-cyan/25 bg-nexora-card/85 p-5 glow-box backdrop-blur-xl relative overflow-hidden transition-all hover:border-nexora-cyan/50">
                <div class="absolute top-0 left-0 w-1.5 h-full bg-gradient-to-b from-nexora-cyan to-blue-500"></div>
                
                <div class="flex items-center space-x-2.5 mb-4">
                    <div class="w-8 h-8 rounded-lg bg-nexora-cyan/10 border border-nexora-cyan/30 flex items-center justify-center text-nexora-cyan text-xs">
                        <i class="fa-solid fa-lock"></i>
                    </div>
                    <h2 class="text-xs font-black font-mono tracking-wider text-white">CHANGE PASSWORD</h2>
                </div>

                <div class="space-y-3">
                    <div>
                        <label class="block text-[10px] font-black text-gray-400 font-mono mb-1">CURRENT PASSWORD</label>
                        <div class="relative flex items-center">
                            <input id="currentPassword" type="password" placeholder="Enter current password" class="w-full h-11 pl-3.5 pr-10 bg-slate-950/90 border border-nexora-cyan/25 rounded-xl text-white text-xs font-mono outline-none focus:border-nexora-cyan transition-all">
                            <button type="button" onclick="toggleVisibility('currentPassword', 'eyeCurrent')" class="absolute right-3 text-gray-400 hover:text-nexora-cyan cursor-pointer p-1">
                                <i id="eyeCurrent" class="fa-solid fa-eye text-xs"></i>
                            </button>
                        </div>
                    </div>

                    <div>
                        <label class="block text-[10px] font-black text-gray-400 font-mono mb-1">NEW PASSWORD</label>
                        <div class="relative flex items-center">
                            <input id="newPassword" type="password" placeholder="At least 6 characters" class="w-full h-11 pl-3.5 pr-10 bg-slate-950/90 border border-nexora-cyan/25 rounded-xl text-white text-xs font-mono outline-none focus:border-nexora-cyan transition-all">
                            <button type="button" onclick="toggleVisibility('newPassword', 'eyeNew')" class="absolute right-3 text-gray-400 hover:text-nexora-cyan cursor-pointer p-1">
                                <i id="eyeNew" class="fa-solid fa-eye text-xs"></i>
                            </button>
                        </div>
                    </div>

                    <button id="updatePasswordBtn" class="w-full mt-1 py-3 bg-gradient-to-r from-nexora-cyan/20 to-blue-500/20 border border-nexora-cyan/40 text-nexora-cyan text-xs font-black font-mono rounded-xl hover:bg-nexora-cyan/30 transition-all cursor-pointer shadow-md active:scale-[0.98]">
                        UPDATE PASSWORD
                    </button>
                </div>
            </div>

            <!-- WITHDRAWAL PIN CARD -->
            <div class="rounded-2xl border border-emerald-500/25 bg-nexora-card/85 p-5 glow-box backdrop-blur-xl relative overflow-hidden transition-all hover:border-emerald-500/50">
                <div class="absolute top-0 left-0 w-1.5 h-full bg-gradient-to-b from-emerald-400 to-emerald-600"></div>
                
                <div class="flex items-center space-x-2.5 mb-4">
                    <div class="w-8 h-8 rounded-lg bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center text-emerald-400 text-xs">
                        <i class="fa-solid fa-shield-keyhole"></i>
                    </div>
                    <h2 class="text-xs font-black font-mono tracking-wider text-white" id="pinCardTitle">WITHDRAWAL PIN</h2>
                </div>

                <div class="space-y-3">
                    <!-- Current PIN Field (Hidden by default kung wala pang PIN, ipapakita o i-a-adjust via script) -->
                    <div id="currentPinWrapper">
                        <label class="block text-[10px] font-black text-gray-400 font-mono mb-1" id="currentPinLabelText">CURRENT 4-DIGIT PIN</label>
                        <div class="relative flex items-center">
                            <input id="currentPinInput" type="password" maxlength="4" inputmode="numeric" placeholder="••••" class="w-full h-11 pl-3.5 pr-10 bg-slate-950/90 border border-emerald-500/25 rounded-xl text-white text-sm tracking-widest font-mono text-center outline-none focus:border-emerald-500 transition-all">
                            <button type="button" onclick="toggleVisibility('currentPinInput', 'eyeCurrentPin')" class="absolute right-3 text-gray-400 hover:text-emerald-400 cursor-pointer p-1">
                                <i id="eyeCurrentPin" class="fa-solid fa-eye text-xs"></i>
                            </button>
                        </div>
                    </div>

                    <div>
                        <label class="block text-[10px] font-black text-gray-400 font-mono mb-1" id="newPinLabelText">NEW 4-DIGIT PIN</label>
                        <div class="relative flex items-center">
                            <input id="withdrawalPinInput" type="password" maxlength="4" inputmode="numeric" placeholder="••••" class="w-full h-11 pl-3.5 pr-10 bg-slate-950/90 border border-emerald-500/25 rounded-xl text-white text-sm tracking-widest font-mono text-center outline-none focus:border-emerald-500 transition-all">
                            <button type="button" onclick="toggleVisibility('withdrawalPinInput', 'eyePin')" class="absolute right-3 text-gray-400 hover:text-emerald-400 cursor-pointer p-1">
                                <i id="eyePin" class="fa-solid fa-eye text-xs"></i>
                            </button>
                        </div>
                        <p class="text-[9px] text-gray-400 font-mono mt-1 text-center">Kakailanganin ang PIN na ito kapag magwi-withdraw ka ng pondo.</p>
                    </div>

                    <button id="savePinBtn" class="w-full mt-1 py-3 bg-gradient-to-r from-emerald-500/20 to-emerald-600/20 border border-emerald-500/40 text-emerald-400 text-xs font-black font-mono rounded-xl hover:bg-emerald-500/30 transition-all cursor-pointer shadow-md active:scale-[0.98]">
                        Create Withdrawal PIN
                    </button>
                </div>
            </div>

        </div>

    </main>

    <!-- FIREBASE & LOGIC -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCIBDQOIiCOgfV4pMCUr0oUCNZoIDYDqGk",
            authDomain: "investpro-2dafb.firebaseapp.com",
            projectId: "investpro-2dafb",
            storageBucket: "investpro-2dafb.firebasestorage.app",
            messagingSenderId: "135092039764",
            appId: "1:135092039764:web:c4c71eef0c904346a77dc1"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // Canvas Background Animation
        const canvas = document.getElementById('tradingBgCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let points = [];
        let totalPoints = Math.floor(window.innerWidth / 80) + 5;
        let stepX = window.innerWidth / (totalPoints - 1);

        for (let i = 0; i < totalPoints; i++) {
            points.push({
                x: i * stepX,
                y: canvas.height / 2 + (Math.random() * 120 - 60),
                targetY: canvas.height / 2 + (Math.random() * 120 - 60),
                speed: 0.015 + Math.random() * 0.01
            });
        }

        function animateTradingBackground() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < points.length; i++) {
                let p = points[i];
                p.y += (p.targetY - p.y) * p.speed;

                if (Math.abs(p.targetY - p.y) < 1) {
                    p.targetY = canvas.height / 2 + (Math.random() * 200 - 100);
                }
            }

            ctx.beginPath();
            ctx.moveTo(points[0].x, canvas.height);
            ctx.lineTo(points[0].x, points[0].y);
            
            for (let i = 0; i < points.length - 1; i++) {
                let xc = (points[i].x + points[i + 1].x) / 2;
                let yc = (points[i].y + points[i + 1].y) / 2;
                ctx.quadraticCurveTo(points[i].x, points[i].y, xc, yc);
            }
            ctx.lineTo(points[points.length - 1].x, canvas.height);
            ctx.closePath();

            let bgGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            bgGrad.addColorStop(0, 'rgba(0, 242, 254, 0.12)');
            bgGrad.addColorStop(1, 'rgba(4, 8, 20, 0)');
            ctx.fillStyle = bgGrad;
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(points[0].x, points[0].y);
            for (let i = 0; i < points.length - 1; i++) {
                let xc = (points[i].x + points[i + 1].x) / 2;
                let yc = (points[i].y + points[i + 1].y) / 2;
                ctx.quadraticCurveTo(points[i].x, points[i].y, xc, yc);
            }
            ctx.strokeStyle = '#00f2fe';
            ctx.lineWidth = 2;
            ctx.stroke();

            requestAnimationFrame(animateTradingBackground);
        }
        animateTradingBackground();

        // Toggle visibility function
        function toggleVisibility(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            if (input.type === "password") {
                input.type = "text";
                icon.classList.remove("fa-eye");
                icon.classList.add("fa-eye-slash");
            } else {
                input.type = "password";
                icon.classList.remove("fa-eye-slash");
                icon.classList.add("fa-eye");
            }
        }

        document.getElementById("backBtn").addEventListener("click", () => {
            window.location.href = "account.html";
        });

        let hasExistingPin = false;

        auth.onAuthStateChanged(async (user) => {
            if(!user){
                window.location.href = "login.html";
                return;
            }

            try {
                const userDoc = await db.collection("Users").doc(user.uid).get();
                if(userDoc.exists){
                    const data = userDoc.data();
                    if(data.withdrawalPin){
                        hasExistingPin = true;
                        document.getElementById("pinCardTitle").textContent = "CHANGE WITHDRAWAL PIN";
                        document.getElementById("newPinLabelText").textContent = "NEW 4-DIGIT PIN";
                        document.getElementById("savePinBtn").textContent = "Update Withdrawal PIN";
                        document.getElementById("currentPinWrapper").style.display = "block";
                    } else {
                        hasExistingPin = false;
                        document.getElementById("currentPinWrapper").style.display = "none";
                        document.getElementById("pinCardTitle").textContent = "WITHDRAWAL PIN";
                        document.getElementById("newPinLabelText").textContent = "ENTER 4-DIGIT PIN";
                        document.getElementById("savePinBtn").textContent = "Create Withdrawal PIN";
                    }
                }
            } catch(e) {
                console.error("Error loading pin status:", e);
            }
        });

        // Update Password Logic
        document.getElementById("updatePasswordBtn").addEventListener("click", async () => {
            const currentPass = document.getElementById("currentPassword").value.trim();
            const newPass = document.getElementById("newPassword").value.trim();

            if(!currentPass) {
                alert("Mangyaring ilagay ang iyong kasalukuyang password.");
                return;
            }
            if(newPass.length < 6) {
                alert("Ang bagong password ay dapat hindi bababa sa 6 na karakter.");
                return;
            }

            try {
                const user = auth.currentUser;
                if(!user || !user.email) return;

                const credential = firebase.auth.EmailAuthProvider.credential(user.email, currentPass);
                await user.reauthenticateWithCredential(credential);
                await user.updatePassword(newPass);

                alert("Matagumpay na na-update ang iyong password!");
                document.getElementById("currentPassword").value = "";
                document.getElementById("newPassword").value = "";
            } catch(err) {
                console.error(err);
                if(err.code === 'auth/wrong-password' || err.code === 'auth/invalid-credential') {
                    alert("Mali ang inilagay mong kasalukuyang password.");
                } else {
                    alert("Nabigo sa pag-update ng password: " + err.message);
                }
            }
        });

        // Save / Update PIN Logic na may kasamang Current PIN verification kung meron na
        document.getElementById("savePinBtn").addEventListener("click", async () => {
            const newPin = document.getElementById("withdrawalPinInput").value.trim();
            
            if(!/^\d{4}$/.test(newPin)) {
                alert("Ang Withdrawal PIN ay dapat eksaktong 4 na numero.");
                return;
            }

            try {
                const user = auth.currentUser;
                if(!user) return;

                const userRef = db.collection("Users").doc(user.uid);
                const userDoc = await userRef.get();

                if(userDoc.exists && userDoc.data().withdrawalPin) {
                    const currentPinInput = document.getElementById("currentPinInput").value.trim();
                    if(!currentPinInput) {
                        alert("Mangyaring ilagay ang iyong kasalukuyang Withdrawal PIN.");
                        return;
                    }
                    if(currentPinInput !== userDoc.data().withdrawalPin) {
                        alert("Mali ang inilagay mong kasalukuyang Withdrawal PIN.");
                        return;
                    }
                }

                await userRef.update({
                    withdrawalPin: newPin
                });

                alert("Matagumpay na na-save/na-update ang iyong 4-digit Withdrawal PIN!");
                hasExistingPin = true;
                document.getElementById("pinCardTitle").textContent = "CHANGE WITHDRAWAL PIN";
                document.getElementById("newPinLabelText").textContent = "NEW 4-DIGIT PIN";
                document.getElementById("savePinBtn").textContent = "Update Withdrawal PIN";
                document.getElementById("currentPinWrapper").style.display = "block";
                document.getElementById("currentPinInput").value = "";
                document.getElementById("withdrawalPinInput").value = "";
            } catch(err) {
                console.error(err);
                alert("Nabigo sa pag-save ng PIN.");
            }
        });
    </script>
</body>
</html>
